# This file defines a module for running tests against the built tunix package.

name: Run Tests Against Tunix Package

on:
  workflow_call:
    inputs:
      dev_image:
        description: 'Immutable Tunix Docker image URI built for this workflow run'
        required: false
        type: string
    secrets:
      HF_TOKEN:
        description: 'HuggingFace token for model downloads'
        required: false
      KAGGLE_USERNAME:
        description: 'Kaggle Username'
        required: false
      KAGGLE_KEY:
        description: 'Kaggle API Key'
        required: false

permissions:
  contents: read

# Persist XLA CPU compiled kernels across runs so JAX unit tests do not
# recompile identical graphs on every CI invocation.
env:
  JAX_COMPILATION_CACHE_DIR: /home/runner/.cache/jax_compilation_cache

jobs:
  run_core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'

      - name: Cache uv wheels and JAX CPU compilation
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            /home/runner/.cache/uv
            /home/runner/.cache/jax_compilation_cache
          key: uv-jax-cpu-core-v2-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            uv-jax-cpu-core-v2-${{ runner.os }}-
            jax-cpu-core-v1-${{ runner.os }}-

      - name: Download the tunix wheel
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: tunix-wheel

      # Use `uv pip install --system` instead of bare `pip install` for ~7x
      # faster dependency resolution and wheel extraction on ephemeral runners.
      - name: Install the tunix wheel
        run: |
          python -m pip install --upgrade uv
          WHEEL=$(ls -1 google_tunix-*-py3-none-any.whl | head -n1)
          uv pip install --system "${WHEEL}[prod,test,experimental]"

      - name: Verify Tunix imports from installed package
        run: |
          python3 -c "
          import tunix
          import tunix.models
          import tunix.generate
          import tunix.sft
          import tunix.distillation
          import tunix.rl

          assert tunix.__version__ != '0.0.0.dev0', 'Tunix version not set correctly'
          print('All tunix modules imported successfully and version is', tunix.__version__)
          "
      # Parallelize multi-file CPU unit test suites across runner vCPUs using
      # `pytest-xdist` (`-n auto`). `--dist=loadfile` keeps all tests within a
      # file on the same worker so module-scoped JAX fixtures/models are only
      # initialized once.
      - name: Run agentic RL tests
        run: |
          python -m pytest -n auto --dist=loadfile tests/rl/agentic/ -v --tb=short

      - name: Run RL unit tests
        run: |
          python -m pytest -n auto --dist=loadfile tests/rl/ -v --tb=short -k "not test_grpo_with_lora_model" --ignore=tests/rl/agentic --ignore=tests/rl/rl_cluster_test.py

      - name: Run CLI utils, mesh, topology, and perf tests
        run: |
          python -m pytest \
            tests/cli/utils/ \
            tests/utils/mesh_test.py \
            tests/utils/topology_test.py \
            tests/perf/ \
            -v --tb=short

      - name: Run model tests
        run: |
          python -m pytest -n auto --dist=loadfile tests/models/ -v --tb=short \
            --ignore=tests/models/naming_test.py

      - name: Compile gRPC Protobuf definitions
        run: |
          python -m grpc_tools.protoc -I. --python_out=. --grpc_python_out=. \
            tunix/experimental/distributed/runtime/discovery/discovery_service.proto

      - name: Run experimental tests
        run: |
          # TODO(tunix-dev): add back raiden tests after tpu_sync lib is ready.
          python -m pytest -n auto --dist=loadfile tests/experimental/ -v --tb=short \
            --ignore-glob='*/raiden_*.py' \
            --ignore=tests/experimental/weight_sync/weight_sync_test.py \
            --ignore=tests/experimental/rollout/vllm_sampler_v2_test.py

  # ---------------------------------------------------------------------------
  # Job: run_vllm
  # Purpose: Run CPU-compatible vLLM driver and rollout unit tests inside the
  #          immutable `tunix/mlperf` container image resolved/built by
  #          `build_tunix_docker` (the exact same image used by `tpu-tests / run_dev`).
  # ---------------------------------------------------------------------------
  run_vllm:
    runs-on: linux-x86-n2-8
    container:
      image: ${{ inputs.dev_image || 'us-central1-docker.pkg.dev/cloud-tpu-multipod-dev/tunix/mlperf:latest' }} # zizmor: ignore[unpinned-images]
      env:
        JAX_PLATFORMS: cpu
        TPU_SKIP_MDS_QUERY: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download the tunix wheel
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: tunix-wheel

      - name: Install the tunix wheel
        run: |
          WHEEL=$(ls -1 google_tunix-*-py3-none-any.whl | head -n1)
          uv pip install "${WHEEL}[tpu,cli,test,experimental]"

      - name: Run vllm driver and rollout experimental tests
        run: |
          python3 -m pytest \
            tests/generate/vllm_driver_test.py \
            tests/experimental/rollout/vllm_sampler_v2_test.py \
            -v --tb=short

  # ---------------------------------------------------------------------------
  # Job: run_dev
  # Purpose: Model download, CLI integration, naming, and alignment tests on CPU.
  # Hardware: 8-vCPU `linux-x86-n2-8` runner inside `tunix/mlperf:<sha>` (where
  #           CPU `torch`, `kagglesdk`, `pytest-xdist`, `zstd`, and all Tunix
  #           dependencies are pre-installed and bytecode-compiled in `/opt/venv`).
  # Secrets: Requires HF_TOKEN and KAGGLE_* secrets (skipped on external fork PRs).
  # Scope: Smoke model creation, CLI config tests, HF naming, and PyTorch alignment.
  # ---------------------------------------------------------------------------
  run_dev:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: linux-x86-n2-8
    container:
      image: ${{ inputs.dev_image || 'us-central1-docker.pkg.dev/cloud-tpu-multipod-dev/tunix/mlperf:latest' }} # zizmor: ignore[unpinned-images]
      env:
        HF_HOME: /root/.cache/huggingface
        KAGGLEHUB_CACHE: /root/.cache/kagglehub
        HF_HUB_ENABLE_HF_TRANSFER: "1"
        HF_XET_HIGH_PERFORMANCE: "1"
        JAX_COMPILATION_CACHE_DIR: /root/.cache/jax_compilation_cache
        JAX_PLATFORMS: cpu
        TPU_SKIP_MDS_QUERY: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Cache Hugging Face hub, Kagglehub, and JAX CPU compilation inside the
      # container (`/root/.cache/...`) without archiving a `uv` wheel cache
      # (all Python wheels are already pre-installed in `tunix/mlperf`).
      - name: Cache HF hub, Kagglehub, and JAX CPU compilation
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            /root/.cache/huggingface
            !/root/.cache/huggingface/xet
            !/root/.cache/huggingface/hub/models--Qwen--Qwen2.5-7B*
            /root/.cache/kagglehub
            /root/.cache/jax_compilation_cache
          key: hf-kaggle-jax-cpu-dev-v4-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            hf-kaggle-jax-cpu-dev-v4-${{ runner.os }}-

      - name: Download the tunix wheel
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: tunix-wheel

      - name: Install the tunix wheel
        run: |
          WHEEL=$(ls -1 google_tunix-*-py3-none-any.whl | head -n1)
          uv pip install "${WHEEL}[tpu,cli,test,experimental]"

      - name: Run Smoke tests (model creation)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          echo "Running Smoke tests..."
          python3 -m pytest tests/smoke_tests/model_creation_test.py -v --tb=short

      - name: Run tunix cli integration tests
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          python3 -m pytest -n auto --dist=loadfile tests/cli/ -v --tb=short \
            --ignore=tests/cli/utils/model_test.py

      - name: Run tunix model naming tests
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 -m pytest tests/models/naming_test.py -v --tb=short

      - name: Run model alignment tests
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          JAX_PLATFORMS=cpu python3 -m pytest tests/model_alignment/ -v --tb=short
          rm -rf /root/.cache/huggingface/xet || true
