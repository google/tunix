# This file defines a module for running tests against the built tunix package.

name: Run Tests Against Tunix Package

on:
  workflow_call:

permissions:
  contents: read

env:
  JAX_COMPILATION_CACHE_DIR: /tmp/jax_compilation_cache
  JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS: "0"

jobs:
  run_core_shard:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard:
          - agentic_and_utils
          - rl
          - models
          - dist_rl
          - experimental
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - name: Cache uv
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/uv
          key: uv-cpu-core-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'requirements/**/*.txt', 'requirements*.txt', 'constraints*.txt') }}
          restore-keys: |
            uv-cpu-core-${{ runner.os }}-

      - name: Cache JAX compilation
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: /tmp/jax_compilation_cache
          key: jax-cache-cpu-core-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'requirements/**/*.txt', 'requirements*.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            jax-cache-cpu-core-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'requirements/**/*.txt', 'requirements*.txt') }}-
            jax-cache-cpu-core-${{ matrix.shard }}-${{ runner.os }}-
            jax-cache-cpu-core-${{ runner.os }}-

      - name: Download the tunix wheel
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: tunix-wheel

      - name: Install the tunix wheel
        run: |
          python -m pip install -q uv
          uv pip install --system --find-links=. --reinstall-package google-tunix "google-tunix[prod,test,experimental]"
          python -c "import pathlib, shutil, sysconfig; root = pathlib.Path(sysconfig.get_paths()['platlib']) / 'tunix'; exts = {ext: list(root.glob(f'{ext}*.so')) for ext in ('dist_rl/worker/_compression_ext', 'rl/_packing_ext', 'utils/_trajectory_logger_ext')}; assert all(exts.values()), f'Missing nanobind extensions in {root}: {exts}'; [shutil.copy2(p, pathlib.Path('tunix') / p.relative_to(root)) for paths in exts.values() for p in paths]"

      - name: Verify Tunix imports from installed package
        run: |
          python3 -c "
          import tunix
          import tunix.models
          import tunix.generate
          import tunix.sft
          import tunix.distillation
          import tunix.rl
          from tunix.dist_rl.worker import _compression_ext
          from tunix.rl import _packing_ext
          from tunix.utils import _trajectory_logger_ext

          assert tunix.__version__ != '0.0.0.dev0', 'Tunix version not set correctly'
          print('All tunix modules imported successfully and version is', tunix.__version__)
          "

      - name: Run agentic RL tests
        if: ${{ matrix.shard == 'agentic_and_utils' }}
        run: |
          python -m pytest tests/rl/agentic/ -n auto --dist load -v --tb=short

      - name: Run Cli utils tests
        if: ${{ matrix.shard == 'agentic_and_utils' }}
        run: |
          python -m pytest tests/cli/utils/ -v --tb=short

      - name: Run shared mesh, topology, and OSS utility tests
        if: ${{ matrix.shard == 'agentic_and_utils' }}
        run: |
          python -m pytest tests/utils/mesh_test.py tests/utils/topology_test.py tests/tests/test_common_test.py -v --tb=short

      - name: Run perf tests
        if: ${{ matrix.shard == 'agentic_and_utils' }}
        run: |
          python -m pytest tests/perf/ -v --tb=short

      - name: Run RL unit tests
        if: ${{ matrix.shard == 'rl' }}
        run: |
          python -m pytest tests/rl/ -n auto --dist loadscope -v --tb=short -k "not test_grpo_with_lora_model" --ignore=tests/rl/agentic --ignore=tests/rl/rl_cluster_test.py

      - name: Run model tests
        if: ${{ matrix.shard == 'models' }}
        run: |
          # Cap at -n 2 to stay within the 16 GB runner RAM budget (~14 GB peak RSS vs ~21.8 GB at -n 4).
          python -m pytest tests/models/ -n 2 --dist loadscope -v --tb=short \
            --ignore=tests/models/naming_test.py \
            --ignore=tests/models/paged_attention_test.py
          python -m pytest tests/models/paged_attention_test.py -n 2 --dist load -v --tb=short

      - name: Compile gRPC Protobuf definitions
        if: ${{ matrix.shard == 'dist_rl' || matrix.shard == 'experimental' }}
        run: |
          find tunix/dist_rl/distributed -name "*.proto" -exec \
            python -m grpc_tools.protoc -I. --python_out=. --grpc_python_out=. {} +

      - name: Run dist_rl tests
        if: ${{ matrix.shard == 'dist_rl' }}
        run: |
          # TODO(tunix-dev): add back raiden tests after tpu_sync lib is ready.
          python -m pytest tests/dist_rl/ -n auto --dist loadscope -v --tb=short \
            --ignore-glob='*/raiden_*.py' \
            --ignore=tests/dist_rl/rollout/vllm_sampler_test.py \
            --ignore=tests/dist_rl/weight_sync/weight_sync_test.py

      - name: Run experimental tests
        if: ${{ matrix.shard == 'experimental' }}
        run: |
          python -m pytest tests/experimental/ -n auto --dist loadscope -v --tb=short \
            --ignore-glob='*/raiden_*.py'

  run_core:
    needs: [run_core_shard]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check core test shards
        env:
          SHARDS_RESULT: ${{ needs.run_core_shard.result }}
        run: |
          if [[ "$SHARDS_RESULT" != "success" ]]; then
            echo "Core test shards failed (result=$SHARDS_RESULT)."
            exit 1
          fi

  run_vllm:
    runs-on: ubuntu-24.04
    container:
      image: vllm/vllm-tpu:nightly-20260911-4b80060-51da0ca # zizmor: ignore[unpinned-images]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download the tunix wheel
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: tunix-wheel

      - name: Install the tunix wheel
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install --find-links=. "google-tunix[prod,test,experimental]"
          python3 -c "import pathlib, shutil, sysconfig; root = pathlib.Path(sysconfig.get_paths()['platlib']) / 'tunix'; exts = {ext: list(root.glob(f'{ext}*.so')) for ext in ('dist_rl/worker/_compression_ext', 'rl/_packing_ext', 'utils/_trajectory_logger_ext')}; assert all(exts.values()), f'Missing nanobind extensions in {root}: {exts}'; [shutil.copy2(p, pathlib.Path('tunix') / p.relative_to(root)) for paths in exts.values() for p in paths]"
          # tpu-inference/Numba needs NumPy 2.3 or less.
          python3 -m pip install numpy==2.3.5 --force-reinstall

      - name: Run vllm driver tests
        run: |
          python3 -m pytest tests/generate/vllm_driver_test.py -v --tb=short

      - name: Run vllm rollout experimental tests
        run: |
          python3 -m pytest tests/dist_rl/rollout/vllm_sampler_test.py -v --tb=short

  # ---------------------------------------------------------------------------
  # Job: run_dev
  # Purpose: Model download, CLI integration, naming, and alignment tests on CPU.
  # Hardware: Standard Ubuntu runner.
  # Secrets: None (uses public Hugging Face Hub and GCS checkpoints).
  # Scope: Smoke model creation, CLI config tests, HF naming, and PyTorch alignment.
  # ---------------------------------------------------------------------------
  run_dev:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - name: Cache uv
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/uv
          key: uv-cpu-dev-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'requirements/**/*.txt', 'requirements*.txt', 'constraints*.txt') }}
          restore-keys: |
            uv-cpu-dev-${{ runner.os }}-

      - name: Cache JAX compilation
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: /tmp/jax_compilation_cache
          key: jax-cache-cpu-dev-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'requirements/**/*.txt', 'requirements*.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            jax-cache-cpu-dev-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'requirements/**/*.txt', 'requirements*.txt') }}-
            jax-cache-cpu-dev-${{ runner.os }}-

      # Cache Hugging Face hub
      - name: Cache HF hub
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'requirements*.txt', 'constraints*.txt') }}
          restore-keys: |
            hf-${{ runner.os }}-

      - name: Download the tunix wheel
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: tunix-wheel

      - name: Install the tunix wheel and dependencies
        run: |
          python -m pip install -q uv
          uv pip install --system --find-links=. --reinstall-package google-tunix "google-tunix[prod,test,experimental]"
          python -c "import pathlib, shutil, sysconfig; root = pathlib.Path(sysconfig.get_paths()['platlib']) / 'tunix'; exts = {ext: list(root.glob(f'{ext}*.so')) for ext in ('dist_rl/worker/_compression_ext', 'rl/_packing_ext', 'utils/_trajectory_logger_ext')}; assert all(exts.values()), f'Missing nanobind extensions in {root}: {exts}'; [shutil.copy2(p, pathlib.Path('tunix') / p.relative_to(root)) for paths in exts.values() for p in paths]"
          uv pip install --system --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match --upgrade kagglehub kagglesdk torch

      - name: Run Smoke tests (model creation)
        run: |
          echo "Running Smoke tests..."
          python -m pytest tests/smoke_tests/model_creation_test.py -v --tb=short

      - name: Run tunix cli integration tests
        run: |
          python -m pytest tests/cli/ -n auto --dist loadscope -v --tb=short \
            --ignore=tests/cli/utils/model_test.py

      - name: Run tunix model naming tests
        run: |
          python -m pytest tests/models/naming_test.py -v --tb=short

      - name: Run model alignment tests
        run: |
          JAX_PLATFORMS=cpu python -m pytest tests/model_alignment/ -v --tb=short
