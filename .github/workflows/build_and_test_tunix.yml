# This workflow will build tunix python package and run tests.

name: Tunix Package Tests

# Trigger the workflow only when code is merging to the 'main' branch.
on:
  pull_request: # Automatically trigger on pull requests affecting this file
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      # Exposed here so a MaxText ref can be tried, or the Pathways trainer
      # exercised, without editing a workflow file. Both are plumbed straight
      # through to tpu-tests.yml, where they are documented.
      maxtext_ref:
        description: 'MaxText git ref for the MaxText RL smoke test ("pinned" = the commit in requirements/maxtext_requirements.txt)'
        required: false
        type: string
        default: 'main'
      # A choice rather than a boolean so the value is a non-empty string even
      # when it is deliberately "true". `inputs` is null on pull_request and
      # schedule, and a boolean is indistinguishable from that null in a `||`
      # fallback -- which would silently flip the mode for the runs nobody is
      # watching.
      trainer_pathways:
        description: 'Run the MaxText RL smoke test trainer on Pathways instead of mcJAX (needs the host-level setup described in tpu-tests.yml)'
        required: false
        type: choice
        options: ['false', 'true']
        default: 'false'
  schedule:
    # Run the job every 16 hours
    - cron:  '0 */16 * * *'

concurrency:
  # Dedup pull requests (canceling previous runs of the same workflow for same PR), and scheduled runs but nothing else
  group: >
    ${{
      github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) ||
      github.event_name == 'schedule' && format('{0}-schedule', github.workflow) ||
      github.run_id
    }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  build_tunix_package:
    name: Build tunix package
    uses: ./.github/workflows/build_package.yml

  tunix_cpu_unit_tests:
    needs: build_tunix_package
    uses: ./.github/workflows/cpu-tests.yml
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}


  tunix_tpu_unit_tests:
    needs: build_tunix_package
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-to-submit') }}
    uses: ./.github/workflows/tpu-tests.yml
    with:
      # `inputs` is empty for pull_request and schedule, so fall back to the same
      # defaults tpu-tests.yml declares.
      maxtext_ref: ${{ inputs.maxtext_ref || 'main' }}
      trainer_pathways: ${{ (inputs.trainer_pathways || 'false') == 'true' }}
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}

  notify_failure:
    name: Notify failed build # creates an issue or modifies last open existing issue for failed build
    needs: [build_tunix_package,tunix_cpu_unit_tests, tunix_tpu_unit_tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
    - name: Check whether one of the jobs failed
      if: ${{ contains(needs.*.result, 'failure') && github.event.pull_request == null && github.event_name != 'workflow_dispatch' }}
      uses: jayqi/failed-build-issue-action@1a893bbf43ef1c2a8705e2b115cd4f0fe3c5649b  # v1.2.0
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
