# This workflow will build tunix python package and run tests.

name: Tunix Package Tests
run-name: "[${{ github.base_ref || github.ref_name }}] ${{ github.workflow }} — ${{ github.event.pull_request.title || github.sha }}"

# Trigger the workflow when code is merging to 'main' or 'atwigg/mlperf'.
on:
  pull_request: # Automatically trigger on pull requests affecting this file
    branches:
      - main
      - atwigg/mlperf
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
  schedule:
    # Run the job every 16 hours
    - cron:  '0 */16 * * *'

concurrency:
  # Dedup pull requests (canceling previous runs of the same workflow for same PR), and scheduled runs but nothing else.
  # Ignore non-'ready-to-submit' label events (e.g. 'cla: yes') so they fall back to github.run_id and do not cancel active runs.
  group: >
    ${{
      github.event_name == 'pull_request' &&
      (github.event.action != 'labeled' || github.event.label.name == 'ready-to-submit') &&
      format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) ||
      github.event_name == 'schedule' && format('{0}-schedule', github.workflow) ||
      github.run_id
    }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  build_tunix_package:
    name: Build tunix package
    if: ${{ github.event.action != 'labeled' || github.event.label.name == 'ready-to-submit' }}
    uses: ./.github/workflows/build_package.yml

  tunix_cpu_unit_tests:
    needs: build_tunix_package
    uses: ./.github/workflows/cpu-tests.yml
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}


  tunix_tpu_unit_tests:
    needs: build_tunix_package
    # Run TPU unit tests on scheduled/manual runs, Copybara PRs, same-repo atwigg/mlperf PRs,
    # or when a maintainer applies the 'ready-to-submit' label.
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        github.event.pull_request.user.login == 'copybara-service[bot]' ||
        (github.base_ref == 'atwigg/mlperf' &&
         github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event.action == 'labeled' &&
         github.event.label.name == 'ready-to-submit')
      }}
    uses: ./.github/workflows/tpu-tests.yml
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}

  notify_failure:
    name: Notify failed build # creates an issue or modifies last open existing issue for failed build
    needs: [build_tunix_package,tunix_cpu_unit_tests, tunix_tpu_unit_tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
    - name: Check whether one of the jobs failed
      if: ${{ contains(needs.*.result, 'failure') && github.event.pull_request == null && github.event_name != 'workflow_dispatch' }}
      uses: jayqi/failed-build-issue-action@1a893bbf43ef1c2a8705e2b115cd4f0fe3c5649b  # v1.2.0
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
