# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: TPU Tests

on:
  workflow_call:

concurrency:
  # Dedup pull requests (canceling previous runs of the same workflow for same PR), and scheduled runs but nothing else
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || github.event_name == 'schedule' && format('{0}-schedule', github.workflow) || github.run_id }}
  cancel-in-progress: true

env:
  # TODO(timsemenov): Cache or mirror Hugging Face model downloads across runs
  # (e.g., via a GCS bucket or runner-local persistent cache) to avoid cross-run
  # HF Hub CDN throughput variance without exceeding GitHub's 10 GB cache quota.
  HF_HOME: /root/.cache/huggingface
  HF_HUB_ENABLE_HF_TRANSFER: "1"
  HF_XET_HIGH_PERFORMANCE: "1"
  JAX_COMPILATION_CACHE_DIR: /root/.cache/jax_compilation_cache
  JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS: "0"
  # 2 GiB cap per cache dir; enables LRU eviction with per-run cache keys.
  JAX_COMPILATION_CACHE_MAX_SIZE: "2147483648"
  VLLM_XLA_CACHE_PATH: /root/.cache/jax_compilation_cache/vllm
  UV_CACHE_DIR: /root/.cache/uv
  UV_BREAK_SYSTEM_PACKAGES: "1"
  TFDS_DATA_DIR: /root/.cache/tensorflow_datasets

# Jobs here are grouped by container image, not by test area. Each job holds an
# entire 8-chip v6e host for its whole duration, and the self-hosted TPU runner
# pool is shared, so the number of jobs -- not their runtime -- is what
# determines how much of that pool a single PR occupies.
#
# Adding a test: put it in the job whose image it needs. Only add a new job if it
# needs a third image, and say why in the review.
#
# Within a job, steps that mutate the Python environment (force-reinstalls, extra
# framework installs) MUST come last, so they cannot perturb the tests above them.
jobs:
  # ---------------------------------------------------------------------------
  # Job: run_core
  # Purpose: Multi-device TPU unit tests and non-vLLM/non-dist-RL integration
  #          smoke tests.
  # Hardware: Live TPU v6e-8 accelerator (1 slice).
  # Image:    JAX stable stack candidate.
  # Secrets:  None (uses public Hugging Face Hub checkpoints).
  # Scope:    Generation, split-mesh RL cluster, and multi-device SFT unit tests
  #           (plus catch-all), followed by the vanilla-rollout GRPO demo and
  #           SFT 2x2 PEFT integration smoke test. Full SFT, distillation, and
  #           CPU/mock suites run in cpu-tests.yml.
  # ---------------------------------------------------------------------------
  run_core:
    runs-on: [linux-x86-ct6e-180-8tpu]
    # Note: GitHub Actions `timeout-minutes` only counts active execution time after
    # a runner picks up the job (queue wait time is excluded). Baseline execution
    # before caching/offloading was ~10.5m (~14.2m historically), so 60m
    # provides >4x headroom while catching hung processes.
    timeout-minutes: 60
    container:
      image: us-docker.pkg.dev/tpu-prod-env-multipod/jax-stable-stack/candidate/tpu:latest # zizmor: ignore[unpinned-images]
      options: --privileged
      env:
        CLOUD_TPU_ACCELERATOR: v6e-8
        JAX_PLATFORMS: tpu
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install zstd and uv
        run: |
          which zstd || (apt-get update -qq && apt-get install -y -qq --no-install-recommends zstd)
          rm -f /etc/pip.conf /root/.config/pip/pip.conf /opt/venv/pip.conf ~/.pip/pip.conf || true
          python3 -m pip install -q uv

      - name: Cache uv
        id: cache-uv
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: /root/.cache/uv
          key: uv-tpu-core-v5-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'requirements/**/*.txt', 'requirements*.txt') }}
          restore-keys: |
            uv-tpu-core-v5-${{ runner.os }}-

      - name: Cache TFDS datasets
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: /root/.cache/tensorflow_datasets
          key: tfds-core-v5-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'requirements/**/*.txt', 'requirements*.txt') }}
          restore-keys: |
            tfds-core-v5-${{ runner.os }}-

      - name: Cache JAX compilation
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: /root/.cache/jax_compilation_cache
          key: jax-cache-core-v5-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'requirements/**/*.txt', 'requirements*.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            jax-cache-core-v5-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'requirements/**/*.txt', 'requirements*.txt') }}-
            jax-cache-core-v5-${{ runner.os }}-

      - name: Install tunix dependencies
        run: |
          uv pip install --python "$(which python3)" "scikit-build-core>=0.10" "nanobind>=2.5.0" cmake ninja
          uv pip install --python "$(which python3)" --no-build-isolation -e ".[tpu,test]"
          # candidate/tpu pre-installs a stale/incomplete tensorflow-datasets;
          # upgrade and reinstall from PyPI (plus undeclared `six`) for gsm8k/mtnt.
          uv pip install --python "$(which python3)" --upgrade --reinstall-package tensorflow-datasets tensorflow-datasets six

      - name: Verify TPU availability
        run: |
          python -c "
          import jax
          print(f'JAX version: {jax.__version__}')
          print(f'JAX devices: {jax.devices()}')

          # Check if we have TPU devices specifically
          devices = jax.devices()
          has_tpu = len(devices) > 0 and all(device.platform == 'tpu' for device in devices)
          print(f'TPU available: {has_tpu}')

          if not has_tpu:
              print('ERROR: No TPU devices found! Expected TPU devices but got:', [device.platform for device in devices])
              exit(1)
          else:
              print(f'SUCCESS: Found {len(devices)} TPU device(s)')
          "

      - name: Run tunix core TPU unit tests (generation)
        run: |
          # tokenizer_adapter_test requires access to gated repo; beam_search,
          # mappings_config, and utils run on CPU in cpu-tests.yml.
          python -m pytest tests/generate/ -v --tb=short \
            --ignore=tests/generate/beam_search_test.py \
            --ignore=tests/generate/mappings_config_test.py \
            --ignore=tests/generate/utils_test.py \
            --ignore=tests/generate/vllm_sampler_test.py \
            --ignore=tests/generate/vllm_sampler_qwen_test.py \
            --ignore=tests/generate/vllm_driver_test.py \
            --ignore=tests/generate/tokenizer_adapter_test.py \
            --ignore=tests/generate/sglang_jax_sampler_test.py \
            --ignore=tests/generate/sglang_jax_lora_test.py

      - name: Run tunix RL cluster TPU tests
        run: |
          # Full rl_cluster_test runs on CPU in cpu-tests.yml; keep the non-vllm/
          # sglang cases that exercise split-mesh TPU placement, weight sync
          # (which skips the CPU transfer guard on TPU), or vanilla generation.
          python -m pytest \
            tests/rl/rl_cluster_test.py::RlEngineTest::test_model_loading_with_resharding \
            tests/rl/rl_cluster_test.py::RlEngineTest::test_init_syncs_restored_actor_weights_to_a_rollout_copy \
            tests/rl/rl_cluster_test.py::RlEngineTest::test_profiler_lifecycle_in_engine \
            -v --tb=short

      - name: Run tunix SFT multi-device TPU tests
        run: |
          # Full SFT and distillation suites run on CPU in cpu-tests.yml; keep
          # multi-device checkpointing and distributed PEFT training tests on TPU.
          python -m pytest tests/sft/checkpoint_manager_test.py tests/sft/peft_trainer_test.py -v --tb=short \
            -k "test_restore_different_sharding or test_restore_with_lora or test_dist_training or distributed or test_compile_once"

      - name: Run tunix tests not covered by the above categories
        run: |
          # This category is to catch tests added but not covered by CI yet. Whenever you add new folders under tests/, please add a new category above and skip those tests here.
          # CPU-offloaded directories (perf, utils, common, diffusion, examples, processors, tests, sft, distillation, rl) are run in cpu-tests.yml.
          python -m pytest tests/ -v --tb=short --ignore=tests/perf/ --ignore=tests/model_alignment/ --ignore=tests/models/ --ignore=tests/cli/ --ignore=tests/utils/ --ignore=tests/common/ --ignore=tests/diffusion/ --ignore=tests/examples/ --ignore=tests/processors/ --ignore=tests/tests/ --ignore=tests/generate/ --ignore=tests/sft/ --ignore=tests/distillation/ --ignore=tests/rl/ --ignore=tests/smoke_tests/ --ignore=tests/dist_rl/ --ignore=tests/experimental/ --ignore=tests/zero_tim_kernel/ || code=$?
          if [ "${code:-0}" = "5" ]; then
            echo "No tests collected (expected)."
            exit 0
          else
            exit "${code:-0}"
          fi

      - name: GRPO Integration Test (Llama3 / Qwen2 multi-device RL training demo)
        run: |
          export JAX_PLATFORMS=tpu,cpu
          # Run GRPO demo script with minimal configuration
          python3 scripts/grpo_demo_llama3_qwen2.py \
            --root-dir=/tmp/grpo_test \
            --num-batches=2 \
            --num-test-batches=1 \
            --global-batch-size=2 \
            --train-mini-batch-size=2 \
            --train-micro-batch-size=2 \
            --rollout-engine=vanilla

      - name: Run tunix SFT integration tests (PEFT with 2x2 mesh on TPU)
        run: |
          export JAX_PLATFORMS=tpu,cpu
          ./tests/sft/sft_tpu_smoke_test.sh

      - name: Prune uv cache
        if: ${{ steps.cache-uv.outputs.cache-hit != 'true' }}
        run: |
          if command -v uv >/dev/null 2>&1; then
            uv cache prune --ci
          fi

  # ---------------------------------------------------------------------------
  # Job: run_dev
  # Purpose: Live vLLM sampler tests and distributed RL smoke tests.
  # Hardware: Live TPU v6e-8 accelerator (1 slice).
  # Image:    vLLM TPU nightly.
  # Secrets:  None (uses public Hugging Face Hub and GCS checkpoints).
  # Scope:    vLLM Sampler generation / LoRA mapping / checkpoint loading, then
  #           the Qwen3-0.6B GSM8K distributed RL smoke test (Tunix and MaxText
  #           backends) with Raiden sync.
  #
  # ORDERING CONSTRAINTS (within run_dev):
  #   1. `Run vllm tests` MUST run BEFORE the Distributed RL smoke stage. It
  #      requires the container's pinned `numpy==2.3.5` (for Numba /
  #      tpu-inference), whereas the Distributed RL setup executes `uv pip
  #      install tensorflow` and upgrades NumPy past 2.3.5.
  #   2. Distributed RL Smoke Test (`run_dist_smoke` steps) MUST run as the last test stage in this job.
  #      It installs the native Raiden weight-sync wheel (`tpu_sync`) and spawns
  #      multi-process trainer/rollout servers across all 8 TPU chips; running it last
  #      prevents background process or chip-lock leakage into earlier tests.
  # ---------------------------------------------------------------------------
  run_dev:
    runs-on: [linux-x86-ct6e-180-8tpu]
    # Note: GitHub Actions `timeout-minutes` only counts active execution time after
    # a runner picks up the job (queue wait time is excluded). Baseline execution
    # before caching/offloading was ~17.2m (~20.9m historically), so 60m
    # provides >3x headroom while catching hung processes.
    timeout-minutes: 60
    container:
      image: vllm/vllm-tpu:nightly-20261110-02e570d-52e8596 # zizmor: ignore[unpinned-images]
      options: --privileged
      env:
        CLOUD_TPU_ACCELERATOR: v6e-8
        JAX_PLATFORMS: tpu,cpu
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install zstd and uv
        run: |
          which zstd || (apt-get update -qq && apt-get install -y -qq --no-install-recommends zstd)
          rm -f /etc/pip.conf /root/.config/pip/pip.conf /opt/venv/pip.conf ~/.pip/pip.conf || true
          python3 -m pip install -q uv

      - name: Cache uv
        id: cache-uv
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: /root/.cache/uv
          key: uv-tpu-dev-v5-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'requirements/**/*.txt', 'requirements*.txt') }}
          restore-keys: |
            uv-tpu-dev-v5-${{ runner.os }}-

      - name: Cache TFDS datasets
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: /root/.cache/tensorflow_datasets
          key: tfds-dev-v5-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'requirements/**/*.txt', 'requirements*.txt') }}
          restore-keys: |
            tfds-dev-v5-${{ runner.os }}-

      - name: Cache JAX compilation
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: /root/.cache/jax_compilation_cache
          key: jax-cache-dev-v5-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'requirements/**/*.txt', 'requirements*.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            jax-cache-dev-v5-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'requirements/**/*.txt', 'requirements*.txt') }}-
            jax-cache-dev-v5-${{ runner.os }}-

      # Shared by every stage below; previously paid once per job.
      - name: Setup Tunix , tpu-inference and dependencies
        run: |
          echo "Current directory:"
          pwd

          # Preserve the container's co-versioned JAX/vLLM/Tokamax stack so resolving Tunix
          # doesn't downgrade preinstalled wheels (including container-only .dev builds).
          # TODO(b/584829765): Deduplicate container-overrides setup with cpu-tests.yml.
          uv pip freeze --python "$(which python3)" \
            | grep -E '^(jax|jaxlib|libtpu|tokamax|flax|safetensors|transformers|huggingface-hub|torch|torchvision|torchax|numba)==' \
            > /tmp/container-overrides.txt || [ "$?" -eq 1 ]

          # Install Tunix with test dependencies without overwriting the vLLM dependencies.
          uv pip install --python "$(which python3)" "scikit-build-core>=0.10" "nanobind>=2.5.0" cmake ninja
          # `--override` forces uv to keep the frozen container versions even if package bounds differ.
          uv pip install --python "$(which python3)" --no-build-isolation --override /tmp/container-overrides.txt -e ".[test]"
          uv pip install --python "$(which python3)" --no-deps --no-build-isolation -r requirements/special_requirements.txt
          # tpu-inference/Numba needs NumPy 2.3 or less.
          uv pip install --python "$(which python3)" --force-reinstall numpy==2.3.5

      # --- vLLM stage (formerly the standalone `run_vllm` job) ----------------
      # [ORDERING CONSTRAINT]: Must run BEFORE the Distributed RL smoke stage.
      # `Setup Tunix and dependencies` below installs tensorflow, which pulls
      # NumPy past the ==2.3.5 pin that tpu-inference/Numba requires.
      - name: Run vllm tests
        run: |
          unset JAX_PLATFORMS
          python3 -m pytest tests/generate/vllm_sampler_qwen_test.py -v --tb=short
          python3 -m pytest tests/generate/vllm_sampler_test.py::VllmSamplerTest -k "batch_mode and not data_parallel or sampling_kwargs" -v --tb=short
          python3 -m pytest tests/generate/vllm_sampler_test.py::VllmSamplerTest -k "server_mode or concurrency" -v --tb=short
          python3 -m pytest tests/generate/vllm_sampler_test.py::VllmSamplerTest -k "data_parallel" -v --tb=short

      # --- Distributed RL smoke stage (formerly the standalone `run_dist_smoke`
      # job) --------------------------------------------------------------------
      # [ORDERING CONSTRAINT]: MUST run as the last test stage in `run_dev`. `install_raiden.sh`
      # installs a pinned native weight-sync wheel (`tpu_sync`), and the recipe
      # below spawns multi-process trainer / rollout servers across all 8 TPU chips.
      # Running it last ensures no background processes or chip locks affect
      # earlier single-process tests.
      #
      # To lift it back out into its own job, move these seven steps verbatim
      # into a new job using the same image; nothing else depends on them.
      # Keeps the name it had as a standalone job. The pip upgrade, editable
      # install and NumPy pin it used to carry are now done once, by the shared
      # setup step at the top of this job.
      - name: Setup Tunix and dependencies
        run: |
          # GSM8K dataset loading via tfds. Installing `tensorflow` upgrades
          # NumPy past the ==2.3.5 pin above, so this stage runs after vLLM.
          uv pip install --python "$(which python3)" tensorflow tensorflow_datasets array_record

      - name: Install Raiden weight sync library
        run: bash scripts/install_raiden.sh

      # Runs before the multi-process smoke recipes below so no leftover
      # trainer / rollout processes or chip locks can affect it. In OSS this
      # covers the native transport; the FFI cases skip because the standalone
      # wheel registers its FFI handlers outside JAX's XLA registry, and run in
      # the internal raiden_integration_test instead.
      - name: Run Raiden weight sync unit and TPU integration tests
        run: |
          JAX_PLATFORMS=cpu python3 -m pytest tests/dist_rl/weight_sync/raiden_synchronizer_test.py -v --tb=short
          python3 -m pytest tests/dist_rl/weight_sync/raiden_integration_test.py -v --tb=short

      # `LOG_ROOT` sends each recipe's trainer / rollout / inference /
      # orchestrator logs (`launch/common/local.sh`) to a per-backend directory
      # that the failure step below prints.
      - name: Run GSM8K Distributed RL Smoke Test (Tunix Backend + Raiden Sync)
        run: |
          # Dump the vfio-ID -> PCI-address map the chip split relies on (~0s, stdlib only).
          python3 scripts/get_sorted_tpu_ids.py --human
          LOG_ROOT="${GITHUB_WORKSPACE}/dist_rl_logs/tunix" \
            ./tunix/dist_rl/examples/recipes/ci_smoke_gsm8k_qwen3_0p6b.sh

      - name: Install MaxText dependencies
        run: |
          # `--override` forces uv to keep the container's frozen JAX/Tokamax/Flax versions over transitive deps.
          uv pip install --python "$(which python3)" --override /tmp/container-overrides.txt -r requirements/maxtext_requirements.txt
          uv pip install --python "$(which python3)" "protobuf>=7.35.1"

      - name: Run GSM8K Distributed RL Smoke Test (MaxText Backend + Raiden Sync)
        run: |
          LOG_ROOT="${GITHUB_WORKSPACE}/dist_rl_logs/maxtext" \
            ./tunix/dist_rl/examples/recipes/ci_smoke_gsm8k_qwen3_0p6b_maxtext.sh

      # Fires for any failure in this job, not just the smoke test above; the
      # `|| true` guards make that harmless when the logs do not exist.
      - name: Print logs on failure
        if: ${{ failure() }}
        run: |
          for backend in tunix maxtext; do
            for node in trainer rollout inference orchestrator; do
              echo "==================== ${backend} ${node} LOG ===================="
              cat "${GITHUB_WORKSPACE}/dist_rl_logs/${backend}/${node}.log" || true
            done
          done

      - name: Prune uv cache
        if: ${{ steps.cache-uv.outputs.cache-hit != 'true' }}
        run: |
          if command -v uv >/dev/null 2>&1; then
            uv cache prune --ci
          fi
