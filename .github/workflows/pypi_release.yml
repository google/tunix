# GitHub Actions workflow for building, testing, and publishing a Python package to PyPI
# using Trusted Publishing (OIDC) and a secure Environment.

name: Build, Test, and Publish Python Package to PyPI

# This triggers when a new "release" is published in the GitHub UI.
# This is safer than publishing on every push to 'main'.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build
      - name: Build distributions
        run: |
          python -m build
      - name: Store package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-package
          path: dist/*

  test:
    name: Run unit tests
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Download package artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: python-package
          path: dist
      - name: Install built package
        run: |
          python -m pip install --upgrade pip
          WHEEL=$(ls -1 dist/google_tunix-*.whl | head -n1)
          python -m pip install "${WHEEL}[test]"
      - name: Run smoke tests
        run: |
          python3 -c "
          import tunix
          import tunix.models
          import tunix.generate
          import tunix.sft
          import tunix.distillation
          import tunix.rl

          print('All tunix modules imported successfully')
          "

  publish-to-pypi:
    name: Publish package to PyPI
    needs: [test]
    runs-on: ubuntu-latest

    # 1. IMPORTANT: Specify the environment
    # This tells GitHub to apply the 'release' environment's rules
    # and to include 'environment: release' in the OIDC token.
    environment: release

    # 2. IMPORTANT: Set permissions for OIDC
    # This gives the workflow write access to the OIDC token,
    # which is required for trusted publishing.
    permissions:
      id-token: write  # Required for trusted publishing

    steps:
      - name: Download package artifacts
        # Retrieve the .whl and .tar.gz files from the 'build' job
        # Note: We download again here; jobs run on fresh VMs.
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: python-package
          path: dist/

      - name: Authenticate to Google Cloud (OSS Exit Gate)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
      - name: Clean up stale releases from staging repo
        run: |
          packages=$(gcloud artifacts packages list \
              --project="oss-exit-gate-prod" \
              --location="us" \
              --repository="tunix--pypi" \
              --format="value(name)" 2>/dev/null)
          echo "${packages}" | xargs -r -I {} sh -c '
              package_name=$(basename "{}")
              echo "Deleting package: $package_name..."
              gcloud artifacts packages delete "{}" \
                  --project="oss-exit-gate-prod" \
                  --location="us" \
                  --repository="tunix--pypi" \
                  --quiet
          '
      - name: Stage distributions to OSS Exit Gate and upload manifest
        run: |
          python -m pip install --upgrade twine
          python -m twine upload \
            --repository-url "https://us-python.pkg.dev/oss-exit-gate-prod/tunix--pypi/" \
            -u oauth2accesstoken \
            -p "$(gcloud auth print-access-token)" \
            dist/*
          echo '{"publish_all": true}' > manifest.json
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/tunix/pypi/manifests/manifest-${{ github.run_id }}-${{ github.run_attempt }}.json"