# Example defaults for the distributed DeepSWE GRPO recipe (Qwen3-32B).
#
# Layered on top of `launch/common/base_dist_config.yaml`; cluster, mesh, and
# chip placement default to `base_dist_config.yaml` (target local) unless set
# below; `k8s_launcher_v2.sh` adds the GKE overrides as `section.key=value`
# arguments. Later `override_config_file=` arguments and `section.key=value`
# overrides win.

model_config:
  model_name: "Qwen3-32B"
  model_source: "huggingface"
  model_id: "Qwen/Qwen3-32B"
  dtype: "float32"
  load_dtype: "float32"
  remat_config: "decoder"
  use_flash_attention: true
  flash_attention_block_size: null
  mesh:
    shape: "(1,2)"
    axis_names: "('fsdp','tp')"

tokenizer_config:
  # A public Hugging Face hub id needs no `HF_TOKEN` (gated repos do). On a
  # host without hub access, set it to `model_config.model_download_path`.
  tokenizer_path: "Qwen/Qwen3-32B"

# Each model family's own chat template, without thinking (base: `raw`).
chat_parser_config:
  type: "auto"
  enable_thinking: false

# The Tunix trainer sends weights in the Tunix layout: only the in-process
# sampler gives the trainer a destination weight tree to convert them to
# (`vllm` needs a trainer that emits the rollout model's layout, such as
# MaxText).
rollout_engine: "inprocess_vllm"
rollout_config:
  max_prompt_length: 4096
  total_generation_steps: 28672
  temperature: 1.0
  top_p: 1.0
  # Disabled.
  top_k: -1
  # Qwen3 `<|im_end|>` token id.
  eos_tokens: "151645"
  return_logprobs: true

vllm_config:
  hbm_utilization: 0.7
  max_num_batched_tokens: 16384

weight_sync_config:
  mode: "raiden"
  use_weight_converter: true
  verify_weights: false
  in_flight_weight_updates: false

# The orchestrator loads the task records with
# `deepswe.create_dataset(**data_config)`.
data_module: "tunix.dist_rl.examples.deepswe_dist.deepswe"
task_name: "deepswe"
data_config:
  split: "train"
  shuffle: true
  seed: 42
  dataset_name: "R2E-Gym/R2E-Gym-Subset"
  # `data_config.dataset_path=<dir>` loads a `save_to_disk` copy instead. Not
  # listed here: an empty string in this file would reach `create_dataset` as
  # None.
  cache_dir: null

# Pre-warms `SandboxFleet` warm pools on the orchestrator when
# `env_kwargs.use_agent_sandbox` is true (no-op when false).
prompt_items_wrapper: "tunix.dist_rl.examples.deepswe_dist.deepswe.prewarm_sandboxes"
prompt_items_wrapper_kwargs:
  max_concurrency: 256
  max_warmpool_replicas: 8

batch_size: 8
rl_training_config:
  mini_batch_size: 8
  train_micro_batch_size: 8
  compute_logps_micro_batch_size: 8
  max_steps: 201
  eval_every_n_steps: 1000000
  actor_optimizer_config:
    opt_type: "adamw"
    learning_rate: 1.0e-6
    # Empty: a constant learning rate.
    schedule_type: ""
    b1: 0.9
    b2: 0.99
    eps: 1.0e-8
    weight_decay: 0.01
    opt_chain_type: "clip_by_global_norm"
    chain_kwargs:
      max_norm: 1.0
  checkpointing_options:
    save_interval_steps: 1
    max_to_keep: 2
  metrics_logging_options:
    project_name: "trellis-deepswe"
    flush_every_n_steps: 1

agentic_grpo_config:
  num_generations: 8
  num_iterations: 1
  beta: 0.0
  epsilon: 0.2
  epsilon_high: 0.28
  loss_algo: "grpo"
  loss_agg_mode: "sequence-mean-token-scale"
  kl_loss_mode: "kl"
  advantage_estimator: "rloo"
  sampler_is: "token"
  sampler_is_threshold: 2.0
  max_concurrency: 256
  off_policy_steps: 0
  trajectory_group_order: "trajectory_completion"
  # "env": `DeepSWEEnv` evaluates each patch in its sandbox and returns reward.
  reward_mode: "env"
  episode_timeout: 4800
  # Keep equal to `env_kwargs.max_steps`.
  max_turns: 50
  overlong_filter: false
  use_rollout_logps: true

reward_functions: []

env_class_path: "deepswe_env"
# `DeepSWEEnv` settings for the whole run; each task record adds `entry` and
# `prompt_id` through `metadata.env_config`.
env_kwargs:
  # Keep equal to `agentic_grpo_config.max_turns`.
  max_steps: 50
  step_timeout: 1800
  reward_timeout: 1800
  backend: "kubernetes"
  use_agent_sandbox: false
  scaffold: "r2egym"
  verbose: false

agent_class_path: "deepswe_agent"
agent_kwargs:
  scaffold: "r2egym"

# Forwarded by `k8s.sh` / `local.sh` to both the orchestrator and rollout
# workers as `NAMESPACE`, `NODE_SELECTOR_KEY`, `NODE_SELECTOR_VAL`, and
# `IMAGE_REWRITE_PREFIX` (alongside `ORCHESTRATOR_ID` when
# `prompt_items_wrapper` is set) for `SWEEnv` / `SandboxFleet` Kubernetes pods.
# On `cluster_config.target=k8s`, `namespace: null` (what `k8s_launcher_v2.sh`
# sets) follows `cluster_config.k8s.namespace`.
kubernetes_config:
  namespace: "rl-tunix-swebench"
  node_selector_key: null
  node_selector_val: null
  image_rewrite_prefix: null

cluster_config:
  # Imported by the rollout node to register `DeepSWEEnv` / `DeepSWEAgent`.
  registry_module: "tunix.dist_rl.examples.deepswe_dist.deepswe"
  artifact_root: "artifacts/deepswe"
  # Null derives the worker RPC deadline from the weight-sync phase timeouts,
  # which scale with `agentic_grpo_config.episode_timeout` (5100s at 4800s).
  rpc_timeout_s: null
  local:
    worker_shutdown_grace_secs: 60
