# Base configuration for the distributed RL launchers in tunix/dist_rl/launch/.
# Follows the exact section and key naming of tunix/cli/base_agentic_config.yaml,
# with defaults matching the existing distributed RL launchers and worker nodes.

################################## LOAD MODEL ##################################
model_config: &base_model_config
  model_name: "Qwen3-1.7B"
  # Supported sources: "kaggle" | "huggingface" | "gcs" | "internal" | "maxtext"
  model_source: "huggingface"
  model_id: "Qwen/Qwen3-1.7B"
  # If model_source is "maxtext", this is the Orbax checkpoint path.
  model_path: ""
  # Defaults to <artifact_root>/models/<model_name> when empty.
  model_download_path: ""
  rng_seed: 0
  model_display: false
  intermediate_ckpt_dir: "/tmp/intermediate_ckpt/"
  dtype: "float32"
  load_dtype: "float32"
  remat_config: "none"
  use_flash_attention: false
  flash_attention_block_size: null
  lora_config: {}
  mesh:
    shape: "(1,2)"
    axis_names: "('fsdp','tp')"
    allocation_policy: "COMPACT"
  # Architecture / MaxText overrides (e.g. maxtext_model_name, maxtext_output_dir,
  # padded_moe_mlp_dim, warmup_steps_fraction, attention). `maxtext_model_name`
  # (e.g. "qwen3-0.6b") is required when `model_source` is "maxtext".
  kwargs: {}

actor_model_config:
  <<: *base_model_config

critic_model_config: null

reference_model_config:
  <<: *base_model_config

rollout_model_config:
  <<: *base_model_config

################################## Tokenizer ##################################
tokenizer_config:
  # Accepts a Hugging Face hub id or a local, CNS, or GCS path.
  tokenizer_path: "Qwen/Qwen3-1.7B"
  tokenizer_type: "huggingface"
  add_bos: true
  add_eos: true

################################## DATASET ##################################
data_source: "tfds"
data_directory: ""
data_module: ""
# Default semantic task_name for data_module records without one; required
# unless every record sets task_name.
task_name: ""
apply_chat_template_to_dataset: false
data_config:
  split: "train"
  shuffle: true
  seed: 42
dataset_name: "gsm8k"
batch_size: 4
prompt_key: "prompts"
max_target_length: 256
num_train_epochs: 1
train_fraction: 1.0
num_test_batches: 100
tfds_download: true
num_batches: 0

############################### Optimizer ###############################
optimizer_config: &base_optimizer_config
  learning_rate: 2.0e-7
  opt_type: "adamw"
  schedule_type: "warmup_cosine_decay_schedule"
  value: null
  peak_value: null
  init_value: 0.0
  end_value: 0.0
  warmup_ratio: 0.1
  b1: 0.9
  b2: 0.999
  eps: 1.0e-8
  weight_decay: 0.01
  warmup_steps: null
  decay_steps: 500
  # Gradient clipping, chained ahead of the optimizer (same contract as
  # `tunix.cli.config.create_optimizer`).
  opt_chain_type: "clip_by_global_norm"
  chain_kwargs:
    max_norm: 1.0

############################### Training Config ###############################
training_config: &base_training_config
  eval_every_n_steps: 50
  max_steps: 1
  # Derived by RLTrainingConfig from mini_batch_size // train_micro_batch_size.
  gradient_accumulation_steps: null
  # On `rl_training_config`, defaults to <cluster_config.artifact_root>/checkpoints
  # when empty.
  checkpoint_root_directory: ""
  checkpointing_options:
    max_to_keep: 10
    save_interval_steps: 1
    enable_async_checkpointing: true
    timeout_secs: 1200
  # `rl_training_config.metrics_logging_options: null` logs no metrics, and no
  # trajectories unless `dist_training_config.trajectory_log_dir` is set.
  metrics_logging_options:
    project_name: "trellis-gsm8k"
    run_name: ""
    # On `rl_training_config`, defaults to <cluster_config.artifact_root>/metrics
    # when empty. The orchestrator also logs the trajectories of each step under
    # <log_dir>/trajectories, unless `dist_training_config.trajectory_log_dir`
    # is set.
    log_dir: ""
    flush_every_n_steps: 1
  perf_metrics_options: {}
  profiler_options:
    log_dir: "/tmp/profiling"
    skip_first_n_steps: 1
    profiler_steps: 0
  data_sharding_axis: ["fsdp"]
  max_inflight_computations: 2
  max_seq_token_per_tpu: null
  max_segments_per_packed_row: null

rl_training_config:
  <<: *base_training_config
  # Defaults to `batch_size` when null.
  mini_batch_size: null
  train_micro_batch_size: 1
  rollout_micro_batch_size: null
  compute_logps_micro_batch_size: 1
  compute_logps_chunk_size: 0
  actor_optimizer_config:
    <<: *base_optimizer_config
  critic_optimizer_config: null

############################### PPO Config ###############################
ppo_config:
  num_iterations: 1
  gae_lambda: 0.95
  gamma: 1.0
  beta: 0.08
  epsilon: 0.2

############################### GRPO Config ###############################
grpo_config:
  num_generations: 8
  num_iterations: 1
  beta: 0.04
  epsilon: 0.2

############################### Rollout Config ###############################
rollout_config:
  total_generation_steps: 1024
  max_prompt_length: 1024
  temperature: 1.0
  top_p: 1.0
  top_k: -1
  eos_tokens: "151645,151643"
  return_logprobs: true

############################### Other RL Config ###############################
rollout_engine: "inprocess_vllm"
vllm_config:
  model_version: ""
  # null: `rollout_engine: vllm` defers to vLLM's native default
  # (`gpu_memory_utilization` is not set); `inprocess_vllm` uses 0.5.
  hbm_utilization: null
  tpu_backend_type: "jax"
  # Start the rollout from random weights instead of loading the checkpoint.
  # Null means true exactly when `weight_sync_config.mode` is "raiden", whose
  # bootstrap sync loads the trainer's weights before step 0; otherwise a
  # non-MaxText rollout loads the checkpoint. An explicit true requires
  # "raiden"; only `rollout_engine: inprocess_vllm` reads it. A MaxText rollout
  # (`rollout_model_config.model_source: maxtext`) never loads the checkpoint,
  # so it always needs "raiden".
  init_with_random_weights: null
  enable_prefix_caching: false
  # Both vLLM rollout engines always run in server mode, so `false` is
  # rejected.
  # TODO(yatlas): Remove this option.
  server_mode: null
  async_scheduling: false
  max_num_seqs: null
  max_num_batched_tokens: null
  max_model_len: null
  data_parallel_size: null
  tensor_parallel_size: null
  dtype: "bfloat16"
  # Distributed rollout settings, validated by `DistHyperParameters` and read
  # by the rollout node and the orchestrator.
  # Capture the MoE experts each token was routed to, so the trainer can replay
  # them (needs a vLLM `rollout_engine`, not "vanilla").
  return_routed_experts: false
  # Compact encoding for captured routed experts, one of
  # `tunix.common.datatypes.ROUTED_EXPERTS_ENCODE_MODES`.
  routed_experts_encode_mode: "auto"
  # Experts per MoE layer (E), a positive int or null; captured ids >= E are
  # rejected. With `routed_experts_encode_mode: "auto"`, the tier comes from E
  # instead of the ids seen.
  routed_experts_num_experts: null
  # Detokenize vLLM outputs so `SamplingResponse.text` is populated
  # (`rollout_engine: vllm` only). Agentic recipes that parse the action from
  # the completion text need this. Token-only workflows can set it to false,
  # but vLLM then rejects stop strings, so stop on `eos_tokens` ids instead.
  # TODO(yatlas): Always detokenize and remove this option.
  detokenize: true
  # Skip tpu_inference's precompilation of every input shape at engine start;
  # each shape then compiles on first use. The rollout node sets
  # `SKIP_JAX_PRECOMPILE` from it.
  skip_jax_precompile: true
  # Free-form vLLM engine arguments (`VLLM_ADDITIONAL_CONFIG_JSON`). The typed
  # keys above are rejected here.
  kwargs: {}
  # Extra `vllm.AsyncEngineArgs` kwargs, for `rollout_engine: vllm` only. Keys
  # owned by other config fields are rejected; `additional_config` (and its
  # `maxtext_config`) is deep-merged onto what the rollout node builds.
  engine_kwargs: {}

offload_to_cpu: false

training_mode: "agentic_grpo"

chat_parser_config:
  type: "raw"
  enable_thinking: false

agent_class_path: "gsm8kagent"
agent_kwargs: {}
env_class_path: "gsm8kenv"
env_kwargs: {}
kubernetes_config: {}

agentic_ppo_config: {}
agentic_grpo_config:
  num_generations: 8
  num_iterations: 1
  beta: 0.04
  epsilon: 0.2
  epsilon_high: 0.28
  loss_algo: "grpo"
  loss_agg_mode: "sequence-mean-token-mean"
  kl_loss_mode: "low_var_kl"
  advantage_estimator: "grpo"
  sampler_is: "token"
  sampler_is_threshold: 2.0
  max_concurrency: 256
  off_policy_steps: 0
  max_version_span: null
  trajectory_group_order: "trajectory_completion"
  reward_mode: "env"
  episode_timeout: 600
  max_turns: 8
  overlong_filter: false
  use_rollout_logps: true

############################# Reward Fns #############################
verl_compatible: false
# Orchestrator-side reward functions (`HyperParameters.obtain_reward_fn`).
# `agentic_grpo_config.reward_mode: "reward_fn"` needs at least one; with
# `"env"` they are added to the environment rewards.
reward_functions: []

######################## Distributed RL Extensions ########################
# Trainer/orchestrator knobs that are not part of the `tunix.cli` training
# config. Kept out of `rl_training_config` so the shared
# `BasePipeline.create_rl_training_config()` builder accepts it unchanged.
dist_training_config:
  # Caps the GB a checkpoint save copies from device to host at once. null
  # keeps the backend's default: MaxText's own cap
  # (`checkpoint_storage_device_host_concurrent_gb`, 8 GB). Only the MaxText
  # trainer takes a value; the Tunix trainer rejects one for now.
  ckpt_d2h_concurrent_gb: null
  # Extra MaxText config arguments for a MaxText trainer
  # (`actor_model_config.model_source: maxtext`), as space-separated
  # `key=value` pairs, e.g. "remat_policy=custom opt_type=sgd". The trainer
  # appends them to the MaxText config it builds. Set them here, not in the
  # `MAXTEXT_EXTRA_FLAGS` or `M_<KEY>` environment variables, which `launch.sh`
  # rejects.
  maxtext_extra_flags: ""
  profiler_period: -1
  segment_alignment_boundary: 1
  # Precompile the trainer step before the first rollout batch arrives.
  precompile_trainer: true
  trajectory_log_dir: ""

weight_sync_config:
  mode: "none"
  raiden_use_ffi: null
  use_weight_converter: true
  prefuse_moe_weights: true
  # Log weight checksums on both sides of each sync, and Raiden's transfer
  # metrics. The trainer and rollout nodes set `VERIFY_WEIGHTS` from it.
  verify_weights: false
  in_flight_weight_updates: false
  # Comma-separated NICs Raiden sends weights over, e.g. "eth0,eth1". "eth0"
  # matches the earlier launchers; empty lets Raiden pick by its own heuristic.
  # The trainer and rollout nodes set `TPU_RAIDEN_DATA_NICS` from it when it is
  # not empty.
  raiden_data_nics: "eth0"

trajectory_store_config:
  enable: false
  backend: "file"
  # Empty with the "file" backend: `<cluster_config.artifact_root>/trajectory_store`.
  dir: ""

cluster_config:
  # Where the processes run and what starts them: "local" (one TPU host,
  # `local.sh`) or "k8s" (GKE, `k8s.sh`), both through `launch.sh`; or
  # "external", processes started by another launcher (e.g. a job scheduler
  # that starts each process separately), which `launch.sh` rejects.
  target: "local"
  # Shared orchestrator for every task; the task comes from `data_module`,
  # `reward_functions` and the rollout `env_class_path`/`agent_class_path`.
  orchestrator_main: "tunix.dist_rl.launch.nodes.orchestrator.main"
  trainer_main: "tunix.dist_rl.launch.nodes.trainer.main"
  rollout_main: "tunix.dist_rl.launch.nodes.rollout.main"
  inference_main: "tunix.dist_rl.launch.nodes.inference.main"
  # Example module (e.g. `examples/math_gsm8k_dist/gsm8k.py`) that the rollout
  # node imports to register the example's environments and agents. Each
  # example YAML sets its own value.
  registry_module: "tunix.dist_rl.examples.math_gsm8k_dist.gsm8k"
  # Relative paths are resolved against the repo root on `target: local` and
  # against the container working directory (repo root) on `target: k8s`;
  # `target: external` requires an absolute filesystem path. The models,
  # checkpoints, and metrics default to subdirectories of it. Each task recipe
  # sets its own value.
  artifact_root: "artifacts/dist_rl"
  run_id: ""
  # Print the commands (local) or manifests (k8s) instead of launching.
  dry_run: false
  debug: false
  rpc_timeout_s: 1800.0
  # Seconds the orchestrator waits for every worker to register; null waits
  # forever (the previous example orchestrators did the same).
  # TODO(noghabi): Default to a finite timeout, so a worker that never
  # registers (e.g. a reference worker started separately) fails the run
  # instead of hanging it. Choose the value per cluster target from measured
  # worker startup times: one fixed value would also fail healthy k8s runs
  # whose TPU JobSets Kueue is still queueing, or whose workers are still
  # loading their model. On local, `local.sh` already fails a worker whose
  # port never opens (`cluster_config.wait_timeout_secs`).
  init_timeout_s: null
  wait_timeout_secs: 1800
  wait_poll_secs: 5
  wait_debug_every_polls: 6
  wait_log_tail_lines: 40
  stop_workers_on_exit: true
  # Evict unreachable rollout workers and retry their in-flight trajectories on
  # surviving rollout workers (`FaultToleranceConfig(enabled=...)`).
  rollout_fault_tolerance: true
  # Start a reference inference worker (for the KL penalty). Null means
  # `agentic_grpo_config.beta > 0`. Set false to use a reference worker started
  # separately; it registers with the orchestrator through discovery.
  run_inference_node: null
  # Rollout workers the orchestrator waits for: `k8s.sh` deploys this many,
  # and an external launcher starts this many. `target: local` requires 1
  # (`local.sh` starts one). With more than one, each rollout reads its
  # 0-based index from the `DIST_RL_ROLLOUT_REPLICA` environment variable.
  rollout_replicas: 1
  # On `target: external`, a worker (trainer, rollout, or inference) listens on
  # the port in the `DIST_RL_WORKER_PORT` environment variable instead of its
  # port here; the launcher assigns one to each worker.
  ports:
    orchestrator: 30000
    trainer: 20000
    rollout: 20001
    inference: 20002
    # OTLP gRPC port of the OpenTelemetry collector that `launch.sh otel`
    # deploys on k8s.
    otel: 4317
  local:
    auto_detect_pci_tpus: false
    trainer_tpu_chips: "0,1"
    rollout_tpu_chips: "2,3"
    inference_tpu_chips: ""
    tpu_chips_per_host_bounds: "1,2,1"
    tpu_host_bounds: "1,1,1"
    allow_multiple_libtpu_load: true
    trainer_pathways: false
    jax_backend_target: "grpc://127.0.0.1:29000"
    worker_shutdown_grace_secs: 10
    trainer_shutdown_grace_secs: 900
    force_arm_secs: 5
  k8s:
    namespace: "default"
    kueue_queue_name: ""
    # Kueue / GKE scheduling for every JobSet; a `leaderworkerset.*.yaml`
    # rollout takes none of these. Empty values keep the template defaults.
    preemptible: false
    priority_class: ""
    service_account: ""
    # Pod termination grace period for every JobSet; null keeps each template's
    # default (300 s for the orchestrator, 10 s for the workers).
    termination_grace_seconds: null
    orchestrator_id: ""
    trainer_id: ""
    rollout_id: ""
    inference_id: ""
    # Name of the OpenTelemetry collector Deployment and Service that
    # `launch.sh otel` deploys (default `<user>-otel`). To export metrics, set
    # OTEL_EXPORTER_OTLP_ENDPOINT=http://<otel_id>:<ports.otel> when launching;
    # every node then exports to it (`tunix/dist_rl/common/otel_setup.py`).
    otel_id: ""
    cpu_machine: "n2-standard-64"
    # Orchestrator node pool and memory request. Empty `cpu_nodepool` selects
    # the node by `cpu_machine`; empty `cpu_memory` requests none.
    cpu_nodepool: ""
    cpu_memory: ""
    gcs_scratch_location: "gs://cloud-pathways-staging/tmp"
    enable_pathways_persistence: false
    trainer_extra_env: ""
    # Container image for the trainer/rollout pods; required for target=k8s
    # (`k8s.sh` fails fast when empty). Example launchers set it.
    tunix_image: ""
    pathways_server_image: "us-docker.pkg.dev/cloud-tpu-v2-images/pathways/server:latest"
    pathways_proxy_image: "us-docker.pkg.dev/cloud-tpu-v2-images/pathways/proxy_server:latest"
    pathways_proxy_memory_limit: "190G"
    pathways_proxy_memory: "16G"
    pathways_rm_memory: "4G"
    user_container_memory: "48G"
    user_container_memory_limit: "70G"
    pathways_worker_memory: "100G"
    # Fail-fast restarts for the trainer and rollout JobSets: a failed pod fails
    # its Job instead of restarting in place, and JobSet recreates the whole
    # JobSet up to `startup_retries` times. Needs `jobset.*.yaml` worker
    # templates; `leaderworkerset.*.yaml` has no fail-fast mode.
    fail_fast: false
    # JobSet `failurePolicy.maxRestarts` for the trainer and rollout JobSets,
    # counted over each JobSet's lifetime. A recreated trainer can re-register
    # only before `bring_up`, so pair `fail_fast` with `teardown_gang_on_exit`.
    startup_retries: 3
    # Labels every JobSet with `scheduling.x-k8s.io/gang-id: <run_id>`, and the
    # orchestrator deletes the run's other JobSets when it exits. Its
    # `service_account` needs RBAC to delete JobSets. Needs `jobset.*.yaml`
    # worker templates (`leaderworkerset.*.yaml` is not deleted by gang
    # teardown).
    teardown_gang_on_exit: false
    # tpu7x dynamic slicing for the trainer and rollout JobSets (needs
    # `jobset.*.yaml` worker templates). `head_nodepool` (requires
    # `use_dynamic_slicing`) pins the Pathways head pod to a node pool.
    use_dynamic_slicing: false
    head_nodepool: ""
    # Rollout JAX compilation cache. Unless `disable`, the rollout pods cache in
    # `local_dir` and use a GCS cache: `rollout_gcs_dir`, or else a directory
    # under `gcs_dir` (or `gs://<bucket>/jax_cache`) named by the rollout config
    # (`resolve_config.rollout_cache_params`); none when all three are empty.
    # TODO(noghabi): Lift `jax_cache` to `cluster_config` and drive local runs
    # from the config too, then retire the cache env vars into `legacy_env.sh`.
    jax_cache:
      disable: false
      local_dir: "/tmp/jax_cache"
      gcs_dir: ""
      rollout_gcs_dir: ""
      bucket: ""
      save: true
    trainer:
      jobset_yaml: "jobset.pathways.yaml"
      tpu_slice: "tpuv5e:4x4"
    rollout:
      jobset_yaml: "leaderworkerset.mcjax.ray.yaml"
      tpu_slice: "tpuv5e:4x4"
