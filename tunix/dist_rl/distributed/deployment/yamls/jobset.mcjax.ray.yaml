apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: ${JOBSET_NAME}
  namespace: ${NAMESPACE}
  ${QUEUE_LABEL}
spec:
  failurePolicy:
    maxRestarts: ${STARTUP_RETRIES}
    restartStrategy: Recreate
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
  replicatedJobs:
  - name: proc
    template:
      spec:
        backoffLimit: ${BACKOFF_LIMIT}
        completionMode: Indexed
        completions: ${COMPLETIONS}
        parallelism: ${PARALLELISM}
        template:
          metadata:
            annotations:
              cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
              ${TPU_ANNOTATIONS}
          spec:
            ${PRIORITY_CLASS_LINE}
            ${SERVICE_ACCOUNT_LINE}
            dnsPolicy: ClusterFirstWithHostNet
            hostNetwork: true
            restartPolicy: ${RESTART_POLICY}
            terminationGracePeriodSeconds: ${TERMINATION_GRACE_SECONDS}
            nodeSelector:
              # tpu7x dynamic slicing: no gke-tpu-topology selector and no
              # nodepool affinity (a carved slice can span pools); the generator
              # fills in the slice annotations and partition-state affinity.
              cloud.google.com/gke-tpu-accelerator: ${TPU_TYPE}
              ${TPU_TOPOLOGY_SELECTOR}
              ${RESERVATION_SELECTOR}
            ${PW_NODE_AFFINITY}
            # tolerations:
            # - key: "google.com/tpu"
            #   operator: "Equal"
            #   value: "present"
            #   effect: "NoSchedule"
            containers:
            - name: ${USER_CONTAINER}
              image: ${USER_CONTAINER_IMAGE}
              imagePullPolicy: Always
              securityContext:
                privileged: true
              resources:
                limits:
                  google.com/tpu: "4"
                requests:
                  google.com/tpu: "4"
              command:
                - bash
                - -c
                - |
                  # PID 1 wrapper: forwards SIGTERM to background child process so K8s
                  # termination grace period shuts down workload cleanly without SIGKILL.
                  # Wait loop wakes up immediately on SIGTERM to run trap handler and wait for
                  # the subshell's direct foreground child to drain (STARTUP_COMMAND should
                  # launch the workload directly or via `exec`).

                  echo "Program Start: $$(date)"
                  _sigterm() {
                    pkill -SIGTERM -P "$$PID" 2>/dev/null || kill -SIGTERM $$(cat /proc/$$PID/task/$$PID/children 2>/dev/null) 2>/dev/null || true
                    kill -SIGTERM "$$PID" 2>/dev/null || true
                  }
                  trap _sigterm SIGTERM

                  # Ray bootstrap. One sampler spans every pod of this JobSet:
                  # pod 0 runs the head and the workload, the rest join and block.
                  # JobSet's headless service makes pod 0 resolvable at a stable
                  # name, which is the only thing the LeaderWorkerSet variant
                  # (leaderworkerset.mcjax.ray.yaml) gets from LWS_LEADER_ADDRESS.
                  export RAY_memory_monitor_refresh_ms=0
                  RAY_HEAD="$${JOBSET_NAME}-$${REPLICATED_JOB_NAME}-$${JOB_INDEX}-0.$${JOBSET_NAME}"
                  echo "Ray head: $${RAY_HEAD}, this pod index: $${POD_INDEX}"

                  (
                    trap 'exit 143' SIGTERM
                    if [ "$${POD_INDEX}" = "0" ]; then
                      ${RAY_HEAD_PRE_INIT_COMMAND}
                      RAY_WAIT_TIMEOUT="$${RAY_CLUSTER_WAIT_TIMEOUT_S:-600}"
                      echo "Starting Ray head..."
                      ray start --head --port=6379 || exit 1
                      SECONDS=0
                      until ray status 2>/dev/null | grep -E -q "/${NUM_CHIPS}(\.0)? TPU"; do
                        if [ "$$SECONDS" -ge "$$RAY_WAIT_TIMEOUT" ]; then
                          echo "ERROR: Timed out after $${RAY_WAIT_TIMEOUT}s waiting for ${NUM_CHIPS} TPUs in Ray cluster." >&2
                          exit 1
                        fi
                        sleep 2
                      done

                      ${STARTUP_COMMAND}
                    else
                      ${RAY_WORKER_PRE_INIT_COMMAND}
                      RAY_WAIT_TIMEOUT="$${RAY_CLUSTER_WAIT_TIMEOUT_S:-600}"
                      # The head may not be up yet; JobSet gives no ordering.
                      SECONDS=0
                      until ray status --address=$${RAY_HEAD}:6379 >/dev/null 2>&1; do
                        if [ "$$SECONDS" -ge "$$RAY_WAIT_TIMEOUT" ]; then
                          echo "ERROR: Timed out after $${RAY_WAIT_TIMEOUT}s waiting for Ray head $${RAY_HEAD}:6379." >&2
                          exit 1
                        fi
                        echo "Ray head $${RAY_HEAD} not ready, retrying in 5s..."
                        sleep 5
                      done
                      ray start --address=$${RAY_HEAD}:6379 --block
                    fi
                  ) & PID=$$!

                  while kill -0 $$PID 2>/dev/null; do
                    wait $$PID 2>/dev/null || true
                  done
                  wait $$PID
                  EXIT_CODE=$$?
                  ${WORKER_NONZERO_EXIT_GUARD}

                  echo "Program End: $$(date)"
                  echo "EXIT_CODE=$$EXIT_CODE"
                  exit $$EXIT_CODE
              env:
              - name: RAIDEN_BROADCAST_K
                value: "${RAIDEN_BROADCAST_K}"
              - name: ENABLE_MULTI_NUMA
                value: "${ENABLE_MULTI_NUMA}"
              - name: TPU_RAIDEN_DATA_NICS
                value: "${TPU_RAIDEN_DATA_NICS}"
              # Injects the JobSet Name
              - name: JOBSET_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
              # Injects the Replicated Job Name
              - name: REPLICATED_JOB_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/replicatedjob-name']
              # Injects the Job Index (which replica group)
              - name: JOB_INDEX
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/job-index']
              # Injects the local Pod Index (if you have multiple completions per job)
              - name: POD_INDEX
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['batch.kubernetes.io/job-completion-index']
              # Empty so vLLM's Ray executor owns device placement, matching
              # leaderworkerset.mcjax.ray.yaml.
              - name: JAX_PLATFORMS
                value: ""
              # Selects the Ray distributed executor in tpu-inference/vLLM. Also
              # what makes tpu_inference.utils.hbm_usage_bytes tolerate devices
              # that are not addressable from this process.
              - name: TPU_MULTIHOST_BACKEND
                value: ray
              - name: TPU_NODE_ID
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['batch.kubernetes.io/job-completion-index']
              - name: VLLM_ENABLE_V1_MULTIPROCESSING
                value: "0"
              - name: RAY_memory_monitor_refresh_ms
                value: "0"
              ports:
              - containerPort: ${USER_CONTAINER_PORT}
                name: grpc # Naming it 'grpc' tells GKE to optimize for HTTP/2
              volumeMounts:
              # vLLM's Ray executor allocates a shared-memory ring buffer for
              # its RPC broadcast; the 64 MiB default /dev/shm is not enough
              # ("Insufficient space in /dev/shm: 160 MiB required").
              - name: dshm
                mountPath: /dev/shm
              - mountPath: /tmp
                name: shared-tmp
            volumes:
            - name: dshm
              emptyDir:
                medium: Memory
            - name: shared-tmp
              hostPath:
                path: /tmp
                type: DirectoryOrCreate
  startupPolicy:
    startupPolicyOrder: AnyOrder
  successPolicy:
    operator: All
