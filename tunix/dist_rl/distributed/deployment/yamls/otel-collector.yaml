# Shared OpenTelemetry Collector (contrib) config for the dist_rl runtime's
# metrics export across all recipes (math_gsm8k_dist, deepswe_dist,
# frozenlake_dist, etc.).
#
# Run as an independent local process under launcher.sh or as a standalone
# Kubernetes Deployment + Service (jobset.otel.yaml) on GKE so metrics
# collection has its own dedicated endpoint decoupled from the orchestrator:
#
#   otelcol-contrib --config tunix/dist_rl/distributed/deployment/yamls/otel-collector.yaml
#
# Then point the orchestrator, trainer, and rollout processes at the dedicated
# collector endpoint with:
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317          # local launcher.sh
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://${USER}-otel:4317       # GKE K8s Service
# (Note: leaderworkerset.mcjax.ray.yaml rollout pods do not set hostNetwork: true,
# so GKE deployments should use the dedicated K8s Service DNS or host IP rather
# than localhost.)
#
# The collector only transports. Aggregation that needs RL semantics (batch
# attribution, percentiles) is done in the runtime before export.

extensions:
  # Durable sending queue: data received by the collector survives a backend
  # outage or collector restart.
  file_storage:
    directory: /tmp/otelcol-storage
    create_directory: true

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 5s
  # Optional: drop the orchestrator's relayed copy of trainer metrics if only
  # the trainer's direct stream is desired.
  # filter/relayed_trainer:
  #   metrics:
  #     datapoint:
  #       - 'resource.attributes["service.name"] == "tunix-orchestrator" and IsMatch(metric.name, "^tunix\\.trainer\\.")'

exporters:
  # Local verification: prints every export to the collector's stdout.
  debug:
    verbosity: basic
  googlecloud:
    sending_queue:
      enabled: true
      storage: file_storage

service:
  extensions: [file_storage]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      # Use [debug] alone to verify locally; add googlecloud to ship to Cloud
      # Monitoring.
      exporters: [debug, googlecloud]
