# Local OpenTelemetry Collector (contrib) config for single-host dist_rl runs
# across all recipes (math_gsm8k_dist, deepswe_dist, frozenlake_dist, etc.).
#
# Run as an independent local process alongside launcher.sh so metrics
# collection has its own dedicated endpoint decoupled from the orchestrator:
#
#   otelcol-contrib --config tunix/dist_rl/distributed/deployment/yamls/otel-collector.yaml
#
# Then point the orchestrator, trainer, and rollout processes at the local
# collector endpoint with:
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317
#
# For Kubernetes / GKE deployments, use jobset.otel.yaml (via
# `k8s_launcher.sh otel` or `k8s_launcher.sh --command otel`), which deploys an
# in-cluster Collector Service reachable at http://${USER}-otel:4317.
#
# The collector only transports. Aggregation that needs RL semantics (batch
# attribution, percentiles) is done in the runtime before export.

extensions:
  # Durable sending queue: data received by the collector survives a backend
  # outage or collector restart.
  file_storage:
    directory: /tmp/otelcol-storage
    create_directory: true

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: localhost:4317

processors:
  batch:
    timeout: 5s
  # Optional: once trainer-native instruments land, drop the orchestrator's
  # relayed copy of trainer metrics if only the trainer's direct stream is
  # desired.
  # filter/relayed_trainer:
  #   metrics:
  #     datapoint:
  #       - 'resource.attributes["service.name"] == "tunix-orchestrator" and IsMatch(metric.name, "^tunix\\.trainer\\.")'

exporters:
  # Local verification: prints every export to the collector's stdout.
  debug:
    verbosity: basic
  googlecloud:
    sending_queue:
      enabled: true
      storage: file_storage

service:
  extensions: [file_storage]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      # Default to [debug] so the collector starts on any host without
      # requiring Cloud Monitoring credentials; add googlecloud to ship to
      # Cloud Monitoring.
      exporters: [debug]
