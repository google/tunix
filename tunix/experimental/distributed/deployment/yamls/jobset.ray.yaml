apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: ${JOBSET_NAME}
  namespace: ${NAMESPACE}
${QUEUE_LABEL}spec:
  failurePolicy:
    maxRestarts: 3
    restartStrategy: Recreate
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
  replicatedJobs:
  - name: proc
    template:
      spec:
        backoffLimit: 2048000
        completionMode: Indexed
        completions: ${COMPLETIONS}
        parallelism: ${PARALLELISM}
        template:
          spec:
            priorityClassName: ${PRIORITY_CLASS}
            serviceAccountName: ${SERVICE_ACCOUNT}
            dnsPolicy: ClusterFirstWithHostNet
            hostNetwork: true
            restartPolicy: OnFailure
            terminationGracePeriodSeconds: 10
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: ${TPU_TYPE}
              cloud.google.com/gke-tpu-topology: ${TPU_TOPOLOGY}
            affinity:
              podAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: cloud.google.com/gke-nodepool
                  labelSelector:
                    matchExpressions:
                    - key: jobset.sigs.k8s.io/jobset-name
                      operator: In
                      values:
                      - ${JOBSET_NAME}
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: cloud.google.com/gke-nodepool
                  labelSelector:
                    matchExpressions:
                    - key: jobset.sigs.k8s.io/jobset-name
                      operator: Exists
                    - key: jobset.sigs.k8s.io/jobset-name
                      operator: NotIn
                      values:
                      - ${JOBSET_NAME}
            containers:
            - name: ${USER_CONTAINER}
              image: ${USER_CONTAINER_IMAGE}
              imagePullPolicy: Always
              securityContext:
                privileged: true
              resources:
                limits:
                  google.com/tpu: "4"
                requests:
                  google.com/tpu: "4"
              command:
                - bash
                - -c
                - |
                  # PID 1 wrapper: forwards SIGTERM to background child process so K8s
                  # termination grace period shuts down workload cleanly without SIGKILL.
                  # Polling sleep loop ensures bash wakes up promptly to run trap handler.

                  echo "Program Start: $$(date)"
                  _sigterm() (kill -SIGTERM $$! 2>/dev/null)
                  trap _sigterm SIGTERM

                  (
                    HEAD_HOST="$${JOBSET_NAME}-proc-0-0.$${JOBSET_NAME}"
                    export TPU_MULTIHOST_BACKEND=ray
                    export JAX_PLATFORMS=""

                    if [ "$${POD_INDEX:-0}" = "0" ]; then
                      echo "Starting Ray Head on $${HOSTNAME}..."
                      ray start --head --port=6379 --resources='{"TPU": 4}' --disable-usage-stats
                      echo "Waiting for all ${COMPLETIONS} TPU nodes to join Ray cluster..."
                      until [ "$$(python3 -c 'import ray; ray.init(address="auto", configure_logging=False); print(len([n for n in ray.nodes() if n["Alive"] and "TPU" in n.get("Resources", {})])); ray.shutdown()' 2>/dev/null)" = "${COMPLETIONS}" ]; do
                        sleep 2
                      done
                      echo "Ray cluster ready with ${COMPLETIONS} TPU nodes. Starting rollout worker..."
                      ${STARTUP_COMMAND}
                    else
                      echo "Starting Ray Worker on $${HOSTNAME}, connecting to $${HEAD_HOST}:6379..."
                      until ray start --address="$${HEAD_HOST}:6379" --resources='{"TPU": 4}' --block --disable-usage-stats; do
                        echo "Ray start failed or connection closed, retrying in 3 seconds..."
                        sleep 3
                      done
                    fi
                  ) & PID=$$!

                  while kill -0 $$PID 2>/dev/null; do
                    sleep 5
                  done
                  wait $$PID
                  EXIT_CODE=$$?

                  echo "Program End: $$(date)"
                  echo "EXIT_CODE=$$EXIT_CODE"
                  exit $$EXIT_CODE
              env:
              # Injects the JobSet Name
              - name: JOBSET_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
              # Injects the Replicated Job Name
              - name: REPLICATED_JOB_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/replicatedjob-name']
              # Injects the Job Index (which replica group)
              - name: JOB_INDEX
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/job-index']
              # Injects the local Pod Index (if you have multiple completions per job)
              - name: POD_INDEX
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['batch.kubernetes.io/job-completion-index']
              - name: TPU_NODE_ID
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['batch.kubernetes.io/job-completion-index']
              - name: TPU_MULTIHOST_BACKEND
                value: "ray"
              - name: VLLM_ENABLE_V1_MULTIPROCESSING
                value: "0"
              ports:
              - containerPort: ${USER_CONTAINER_PORT}
                name: grpc # Naming it 'grpc' tells GKE to optimize for HTTP/2
              volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              - mountPath: /tmp
                name: shared-tmp
            volumes:
            - name: dshm
              emptyDir:
                medium: Memory
            - name: shared-tmp
              hostPath:
                path: /tmp
                type: DirectoryOrCreate
  startupPolicy:
    startupPolicyOrder: AnyOrder
  successPolicy:
    operator: All
