apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: ${JOBSET_NAME}
  namespace: ${NAMESPACE}
${QUEUE_LABEL}spec:
  failurePolicy:
    restartStrategy: Recreate
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
  replicatedJobs:
  - name: proc
    template:
      spec:
        backoffLimit: 2048000
        completionMode: Indexed
        completions: ${COMPLETIONS}
        parallelism: ${PARALLELISM}
        template:
          metadata:
            annotations:
              cluster-autoscaler.kubernetes.io/safe-to-evict: "false"${TPU_ANNOTATIONS}
          spec:
            serviceAccountName: ${SERVICE_ACCOUNT}
            dnsPolicy: ClusterFirstWithHostNet
            hostNetwork: true
            restartPolicy: OnFailure${PRIORITY_CLASS_LINE}
            terminationGracePeriodSeconds: 10
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: ${TPU_TYPE}${TPU_TOPOLOGY_SELECTOR}${RESERVATION_SELECTOR}
${TPU_AFFINITY}
            # tolerations:
            # - key: "google.com/tpu"
            #   operator: "Equal"
            #   value: "present"
            #   effect: "NoSchedule"
            containers:
            - name: ${USER_CONTAINER}
              image: ${USER_CONTAINER_IMAGE}
              imagePullPolicy: Always
              securityContext:
                privileged: true
              resources:
                limits:
                  google.com/tpu: "4"
                requests:
                  google.com/tpu: "4"
              command:
                - bash
                - -c
                - |
                  # PID 1 wrapper: forwards SIGTERM to background child process so K8s
                  # termination grace period shuts down workload cleanly without SIGKILL.
                  # Polling sleep loop ensures bash wakes up promptly to run trap handler.

                  echo "Program Start: $$(date)"
                  _sigterm() (kill -SIGTERM $$! 2>/dev/null)
                  trap _sigterm SIGTERM

                  # Ray bootstrap. One sampler spans every pod of this JobSet:
                  # pod 0 runs the head and the workload, the rest join and block.
                  # JobSet's headless service makes pod 0 resolvable at a stable
                  # name, which is the only thing the LeaderWorkerSet variant
                  # (leaderworkerset.mcjax.ray.yaml) gets from LWS_LEADER_ADDRESS.
                  export RAY_memory_monitor_refresh_ms=0
                  export ENABLE_MULTI_NUMA=1
                  RAY_HEAD="$${JOBSET_NAME}-$${REPLICATED_JOB_NAME}-$${JOB_INDEX}-0.$${JOBSET_NAME}"
                  echo "Ray head: $${RAY_HEAD}, this pod index: $${POD_INDEX}"
                  python3 -c "import site; p = site.getsitepackages()[0] + '/sitecustomize.py'; open(p, 'w').write('try:\n    from tunix.experimental.weight_sync import raiden_preload\n    raiden_preload.import_raiden()\nexcept Exception:\n    pass\n')" || true
                  if [ ! -d /app/Qwen/Qwen3.5-397B-A17B ]; then python3 -c "import gcsfs, os; fs = gcsfs.GCSFileSystem(); os.makedirs('/app/Qwen/Qwen3.5-397B-A17B', exist_ok=True); fs.get('bodaborg-tpu7x-nap-us-central1/wuhao/tokenizer/', '/app/Qwen/Qwen3.5-397B-A17B/', recursive=True)" || true; fi

                  (
                    if [ "$${POD_INDEX}" = "0" ]; then
                      echo "Starting Ray head..."
                      ray start --head --port=6379
                      sleep 5; until ray status; do sleep 5; done
                      if [ -n "${COMPLETIONS}" ] && [ "${COMPLETIONS}" -gt 1 ]; then
                        echo "Waiting for all ${COMPLETIONS} Ray nodes to join..."
                        until python3 -c "import ray; ray.init(address='auto', logging_level='error'); alive=len([n for n in ray.nodes() if n.get('Alive')]); print(f'Ray alive nodes: {alive}/${COMPLETIONS}'); exit(0 if alive >= ${COMPLETIONS} else 1)"; do
                          sleep 5
                        done
                        echo "All ${COMPLETIONS} Ray nodes joined successfully!"
                      fi

                      ${STARTUP_COMMAND}
                    else
                      # The head may not be up yet; JobSet gives no ordering.
                      until ray start --address=$${RAY_HEAD}:6379 --block; do
                        echo "Ray head $${RAY_HEAD} not ready, retrying in 5s..."
                        sleep 5
                      done
                    fi
                  ) & PID=$$!

                  while kill -0 $$PID 2>/dev/null; do
                    sleep 5
                  done
                  wait $$PID
                  EXIT_CODE=$$?

                  echo "Program End: $$(date)"
                  echo "EXIT_CODE=$$EXIT_CODE"
                  exit $$EXIT_CODE
              env:
              # Injects the JobSet Name
              - name: JOBSET_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
              # Injects the Replicated Job Name
              - name: REPLICATED_JOB_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/replicatedjob-name']
              # Injects the Job Index (which replica group)
              - name: JOB_INDEX
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/job-index']
              # Injects the local Pod Index (if you have multiple completions per job)
              - name: POD_INDEX
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['batch.kubernetes.io/job-completion-index']
              # Empty so vLLM's Ray executor owns device placement, matching
              # leaderworkerset.mcjax.ray.yaml.
              - name: JAX_PLATFORMS
                value: ""
              # Selects the Ray distributed executor in tpu-inference/vLLM. Also
              # what makes tpu_inference.utils.hbm_usage_bytes tolerate devices
              # that are not addressable from this process.
              - name: TPU_MULTIHOST_BACKEND
                value: ray
              - name: TPU_NODE_ID
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['batch.kubernetes.io/job-completion-index']
              - name: VLLM_ENABLE_V1_MULTIPROCESSING
                value: "0"
              - name: RAY_memory_monitor_refresh_ms
                value: "0"
              ports:
              - containerPort: ${USER_CONTAINER_PORT}
                name: grpc # Naming it 'grpc' tells GKE to optimize for HTTP/2
              volumeMounts:
              # vLLM's Ray executor allocates a shared-memory ring buffer for
              # its RPC broadcast; the 64 MiB default /dev/shm is not enough
              # ("Insufficient space in /dev/shm: 160 MiB required").
              - name: dshm
                mountPath: /dev/shm
              - mountPath: /tmp
                name: shared-tmp
            volumes:
            - name: dshm
              emptyDir:
                medium: Memory
            - name: shared-tmp
              hostPath:
                path: /tmp
                type: DirectoryOrCreate
  startupPolicy:
    startupPolicyOrder: AnyOrder
  successPolicy:
    operator: All
