# Apply directly with: kubectl apply -f tunix/experimental/examples/deepswe_dist/eval_qwen35_gke.yaml
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: "haoyu-deepswe-qwen35-dist-eval"
  namespace: "trellis"
  labels:
    kueue.x-k8s.io/priority-class: medium
    kueue.x-k8s.io/queue-name: multislice-queue
    xpk.google.com/workload: "haoyu-deepswe-qwen35-dist-eval"
spec:
  failurePolicy:
    # Each restart writes a distinct run directory; scores never mix attempts.
    maxRestarts: 0
    restartStrategy: Recreate
  coordinator:
    replicatedJob: pathways-head
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
  replicatedJobs:
  - name: pathways-head
    replicas: 1
    template:
      spec:
        backoffLimit: 0
        completionMode: Indexed
        completions: 1
        parallelism: 1
        template:
          metadata:
            annotations:
              cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
          spec:
            serviceAccountName: "xpk-sa"
            priorityClassName: medium
            hostNetwork: true
            dnsPolicy: ClusterFirstWithHostNet
            restartPolicy: Never
            terminationGracePeriodSeconds: 300
            nodeSelector:
              cloud.google.com/gke-nodepool: "cpu-np"
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  namespaceSelector: {}
                  labelSelector:
                    matchExpressions:
                    - key: jobset.sigs.k8s.io/replicatedjob-name
                      operator: In
                      values: [pathways-head, proc]
            tolerations:
            - key: cloud.google.com/gke-nodepool
              operator: Equal
              value: "cpu-np"
              effect: NoSchedule
            initContainers:
            - name: tunix-source
              image: "gcr.io/cloud-tpu-multipod-dev/sanbao/tunix_stack:eval"
              imagePullPolicy: Always
              command: [bash, -c]
              args:
              - |
                set -euo pipefail
                git clone --depth=1 \
                  --branch sanbao/trellis_eval \
                  https://github.com/google/tunix.git \
                  /workspace/tunix
                git -C /workspace/tunix rev-parse HEAD
              resources:
                requests: {cpu: "1", memory: 1Gi}
                limits: {cpu: "2", memory: 2Gi}
              volumeMounts:
              - {name: source, mountPath: /workspace}
            - name: pathways-proxy
              image: "us-docker.pkg.dev/cloud-tpu-v2-images/pathways/proxy_server:20260730-jax_0.10.2"
              restartPolicy: Always
              args:
              - --server_port=29000
              - --resource_manager_address=$(PATHWAYS_HEAD):29001
              - "--gcs_scratch_location=gs://cloud-pathways-staging/tmp/haoyu-deepswe-qwen35-dist-eval"
              - --temporary_flags_for_debugging=temporary_flag_for_debugging_pipe_unreachable_timeout=7200s
              env:
              - name: PATHWAYS_HEAD
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/coordinator']
              - name: PATHWAYS_HEARTBEAT_TIMEOUT_SECS
                value: "7200"
              - name: MEGASCALE_HEARTBEAT_TIMEOUT_SECS
                value: "7200"
              - name: ENABLE_PATHWAYS_PERSISTENCE
                value: "1"
              resources:
                requests: {cpu: "24", memory: 50Gi}
                limits: {cpu: "64", memory: 120Gi}
            - name: pathways-rm
              image: "us-docker.pkg.dev/cloud-tpu-v2-images/pathways/server:20260730-jax_0.10.2"
              restartPolicy: Always
              args:
              - --server_port=29001
              - "--gcs_scratch_location=gs://cloud-pathways-staging/tmp/haoyu-deepswe-qwen35-dist-eval"
              - --node_type=resource_manager
              - --instance_count=1
              - --instance_type=tpuv5:4x4x4
              - --temporary_flags_for_debugging=temporary_flag_for_debugging_pipe_unreachable_timeout=7200s
              env:
              - name: HOST_ADDRESS
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/coordinator']
              - name: TPU_SKIP_MDS_QUERY
                value: "true"
              - name: CLOUD_TPU_ACCELERATOR_TYPE
                value: v5p-128
              - name: ENABLE_PATHWAYS_PERSISTENCE
                value: "1"
              resources:
                requests: {cpu: "4", memory: 4Gi}
                limits: {cpu: "64", memory: 10Gi}
            containers:
            - name: deepswe-eval
              image: "gcr.io/cloud-tpu-multipod-dev/sanbao/tunix_stack:eval"
              imagePullPolicy: Always
              workingDir: /workspace/tunix
              command:
              - python3
              - -u
              - tunix/experimental/examples/deepswe_dist/eval_launcher.py
              args:
              - --model_absolute_path
              - "gs://maxtext-model-checkpoints/qwen3.5-35b-a3b/unscanned/0/items"
              - --dataset_path
              - "gs://sanbao-europe/mlperf_dataset/r2e-gym-easy-format"
              - --dataset_split=validation
              - --output_dir
              - "gs://sanbao-europe/mlperf/qwen35_35b/dist_eval_results"
              env:
              - name: EVAL_JOBSET_NAME
                value: "haoyu-deepswe-qwen35-dist-eval"
              - name: EVAL_TPU_HOSTS
                value: "16"
              - name: NAMESPACE
                value: "trellis"
              - name: PATHWAYS_HEAD
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/coordinator']
              - name: JAX_PLATFORMS
                value: proxy,cpu
              - name: JAX_BACKEND_TARGET
                value: grpc://$(PATHWAYS_HEAD):29000
              - name: VLLM_TPU_USING_PATHWAYS
                value: "1"
              - name: PYTHONPATH
                value: /workspace/tunix
              - name: XCLOUD_ENVIRONMENT
                value: GCP
              - name: PATHWAYS_HEARTBEAT_TIMEOUT_SECS
                value: "7200"
              - name: MEGASCALE_HEARTBEAT_TIMEOUT_SECS
                value: "7200"
              - name: PATHWAYS_TASK_TIMEOUT_SECS
                value: "7200"
              - name: ENABLE_PATHWAYS_PERSISTENCE
                value: "1"
              - name: XLA_PYTHON_CLIENT_PREALLOCATE
                value: "false"
              - name: CLOUD_TPU_ACCELERATOR_TYPE
                value: v5p-128
              - name: TPU_CHIPS_PER_HOST_BOUNDS
                value: "2,2,1"
              - name: TPU_HOST_BOUNDS
                value: "2,2,4"
              - name: TPU_SKIP_MDS_QUERY
                value: "true"
              - name: NODE_SELECTOR_KEY
                value: cloud.google.com/gke-nodepool
              - name: NODE_SELECTOR_VAL
                value: "cpu-np"
              - name: OPENHANDS_SUPPRESS_BANNER
                value: "1"
              - name: OPENHANDS_SERVER_IMAGE
                value: "gcr.io/cloud-tpu-multipod-dev/sanbao/openhands-agent-server:1.44.1"
              - name: SANDBOX_SESSION_KEY
                valueFrom:
                  secretKeyRef:
                    name: "deepswe-eval-secrets"
                    key: sandbox-session-key
              - name: DOCKER_IMAGE_PREFIX
                value: "europe-west4-docker.pkg.dev/cloud-tpu-multipod-dev/tunix"
              - name: IMAGE_REWRITE_PREFIX
                value: "europe-west4-docker.pkg.dev/cloud-tpu-multipod-dev/tunix"
              - name: USE_MOE_EP_KERNEL
                value: "0"
              - name: ONEHOT_MOE_PERMUTE_THRESHOLD
                value: "32768"
              - name: VLLM_MOE_CHUNK_SIZE
                value: "256"
              - name: SLICE_ROPE_CACHE
                value: "1"
              - name: DP_SCHED_BATCH_PREFILL
                value: "false"
              - name: NUM_PRECOMPILE_WORKERS
                value: "8"
              - name: VLLM_TPU_RPA_VERSION
                value: "2"
              - name: DISABLE_MOSAIC_ATTN
                value: "1"
              - name: HF_HOME
                value: /scratch/huggingface
              - name: JAX_COMPILATION_CACHE_DIR
                value: /scratch/jax
              - name: VLLM_CACHE_ROOT
                value: /scratch/vllm
              - name: VLLM_XLA_CACHE_PATH
                value: /scratch/vllm/xla_cache
              resources:
                requests: {cpu: "28", memory: 96Gi, ephemeral-storage: 100Gi}
                limits: {cpu: "32", memory: 150Gi, ephemeral-storage: 250Gi}
              volumeMounts:
              - {name: source, mountPath: /workspace}
              - {name: scratch, mountPath: /scratch}
            volumes:
            - name: source
              emptyDir: {}
            - name: scratch
              emptyDir: {sizeLimit: 240Gi}
  - name: worker
    replicas: 1
    template:
      spec:
        backoffLimit: 0
        completionMode: Indexed
        completions: 16
        parallelism: 16
        template:
          metadata:
            annotations:
              alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
              cloud.google.com/gke-tpu-slice-topology: 4x4x4
              cloud.google.com/skip-tpu-webhook-check: "true"
              cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
          spec:
            serviceAccountName: "xpk-sa"
            priorityClassName: medium
            hostNetwork: true
            dnsPolicy: ClusterFirstWithHostNet
            restartPolicy: Never
            terminationGracePeriodSeconds: 30
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu-v5p-slice
              cloud.google.com/gke-tpu-topology: 4x4x4
              cloud.google.com/reservation-name: "cloudtpu-20260902214500-1810493672"
            affinity:
              podAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: cloud.google.com/gke-nodepool
                  labelSelector:
                    matchLabels:
                      jobset.sigs.k8s.io/jobset-name: "haoyu-deepswe-qwen35-dist-eval"
                      jobset.sigs.k8s.io/replicatedjob-name: worker
            tolerations:
            - key: google.com/tpu
              operator: Exists
              effect: NoSchedule
            - key: cloud.google.com/reservation-name
              operator: Exists
              effect: NoSchedule
            containers:
            - name: pathways-worker
              image: "us-docker.pkg.dev/cloud-tpu-v2-images/pathways/server:20260730-jax_0.10.2"
              args:
              - --server_port=29005
              - --resource_manager_address=$(PATHWAYS_HEAD):29001
              - "--gcs_scratch_location=gs://cloud-pathways-staging/tmp/haoyu-deepswe-qwen35-dist-eval"
              - --node_type=worker
              - --instance_type=tpuv5:4x4x4
              env:
              - name: PATHWAYS_HEAD
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/coordinator']
              - name: MEGASCALE_COORDINATOR_ADDRESS
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/coordinator']
              - name: MEGASCALE_SLICE_ID
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/job-index']
              - name: MEGASCALE_NUM_SLICES
                value: "1"
              - name: JOBSET_NAME
                value: "haoyu-deepswe-qwen35-dist-eval"
              - name: REPLICATED_JOB_NAME
                value: worker
              - name: ENABLE_PATHWAYS_PERSISTENCE
                value: "1"
              - name: PATHWAYS_HEARTBEAT_TIMEOUT_SECS
                value: "7200"
              - name: MEGASCALE_HEARTBEAT_TIMEOUT_SECS
                value: "7200"
              - name: PATHWAYS_TASK_TIMEOUT_SECS
                value: "7200"
              - name: XCLOUD_ENVIRONMENT
                value: GCP
              - name: TPU_SKIP_MDS_QUERY
                value: "true"
              - name: CLOUD_TPU_ACCELERATOR_TYPE
                value: v5p-128
              - name: TPU_CHIPS_PER_HOST_BOUNDS
                value: "2,2,1"
              - name: TPU_HOST_BOUNDS
                value: "2,2,4"
              - name: TPU_TOPOLOGY_WRAP
                value: "false,false,false"
              - name: TPU_TOPOLOGY_ALT
                value: "false"
              - name: XLA_PYTHON_CLIENT_PREALLOCATE
                value: "false"
              - name: TPU_FLAGS
                value: tpu_program_cache_eviction_policy=lru_program_eviction
              - name: LIBTPU_INIT_ARGS
                value: "--xla_tpu_use_minor_sharding_for_major_trivial_input=true --xla_tpu_enable_sparse_core_collective_offload_reduce_scatter=false --xla_tpu_ars_combiner_threshold_in_bytes=0 --xla_tpu_enable_async_collective_merger=false --xla_tpu_check_legacy_constraints_in_reduce_scatter_legalizer=false"
              ports:
              - {containerPort: 29005}
              - {containerPort: 29006}
              - {containerPort: 8471}
              resources:
                requests: {google.com/tpu: "4"}
                limits: {google.com/tpu: "4"}
  startupPolicy:
    startupPolicyOrder: InOrder
  successPolicy:
    operator: All
    targetReplicatedJobs: [pathways-head]
  suspend: false
