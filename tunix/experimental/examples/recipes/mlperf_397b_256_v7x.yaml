# MLPerf DeepSWE recipe: Qwen3.5-397B-A17B MoE on 256 TPU v7x chips.
#
# Layered on `launch/common/base_dist_config.yaml` by `mlperf_397b_256_v7x.sh`.
# Holds every training setting; the command line adds only the per-run
# environment (image, checkpoint, dataset, bucket paths, cluster); see
# `README.md`.
# - Trainer: 128 chips (tpu7x:4x4x8 = 256 devices, MaxText FSDP=32, EP=2, CP=4
#   with `cp-as-ep` Ring-of-Experts and `fp8_moe_fake_quant`) under Pathways
#   dynamic slicing.
# - Rollout: 128 chips (32 x tpu7x:2x2x1 = 8 devices / 1 host per replica,
#   single-host `jobset.tpu.yaml`, vLLM EP=8, TP=1, FP8 MoE `fp8_moe=true`).
# - Sandboxes: OpenHands CodeAct on Kubernetes Agent Sandbox warm pools.
# - Scaling: override `cluster_config.rollout_replicas=128`, `batch_size=32`
#   (or `64`), optimizer `learning_rate` / `max_norm`, `max_concurrency`, and
#   `cluster_config.roles.trainer.memory.request=96G` (or `160G`) for the
#   512-rollout-chip GBS=512 / GBS=1024 configurations.

model_config:
  model_name: "Qwen3.5-397B-A17B"
  model_id: "Qwen/Qwen3.5-397B-A17B"
  model_source: "maxtext"
  dtype: "float32"
  load_dtype: "float32"
  remat_config: "none"
  use_flash_attention: false
  flash_attention_block_size: null
  # Memory-backed volume on the trainer (`jobset.pathways.yaml`) and rollout
  # pods; `HF_HOME` below points there too.
  model_download_path: "/dev/shm/models"
  kwargs:
    maxtext_model_name: "qwen3.5-397b-a17b"

tokenizer_config:
  tokenizer_path: "Qwen/Qwen3.5-397B-A17B"

chat_parser_config:
  type: "auto"
  enable_thinking: false

actor_model_config:
  mesh:
    shape: "(32,1,2)"
    axis_names: "('fsdp','tp','expert')"
  kwargs:
    mesh_context: 4
    attention: "flash"
    base_num_kv_heads: 2
    prefuse_moe_weights: true
    warmup_steps_fraction: 0.0
    skip_step_on_nan: true

rollout_engine: "vllm"
rollout_model_config:
  mesh:
    shape: "(1,1,8)"
    axis_names: "('fsdp','tp','expert')"
  kwargs:
    attention: "vllm_rpa"
    float32_gate_logits: true
    float32_logits: true

rollout_config:
  max_prompt_length: 8192
  total_generation_steps: 57344
  temperature: 1.0
  top_p: 1.0
  # Disabled.
  top_k: -1
  eos_tokens: "248046,248044"

vllm_config:
  skip_jax_precompile: false
  max_model_len: 65536
  max_num_seqs: 16
  max_num_batched_tokens: 2048
  async_scheduling: true
  hbm_utilization: 0.9
  enable_prefix_caching: true
  return_routed_experts: true
  routed_experts_encode_mode: "auto"
  routed_experts_num_experts: 512
  engine_kwargs:
    enable_expert_parallel: true
    prefix_cache_retention_interval: 0
    kv_cache_dtype: "bfloat16"
    block_size: 256
    enable_chunked_prefill: true
    language_model_only: true
    reasoning_parser: "qwen3"
    limit_mm_per_prompt:
      image: 0
      video: 0
    additional_config:
      sharding:
        sharding_strategy:
          expert_parallelism: 8
          tensor_parallelism: 1
          # Without attention DP on EP=8, `maxtext_vllm_adapter` replicates KV
          # heads 2 -> 8 (`tp * ep`), matched by `kv_tp_size: 8` on the trainer
          # weight converter below.
          enable_dp_attention: false
      custom_mamba_cache_multiplier: 16
      maxtext_config:
        use_multimodal: false
        per_device_batch_size: 0.0
        fp8_moe: true

weight_sync_config:
  mode: "raiden"
  use_weight_converter: true
  prefuse_moe_weights: true
  in_flight_weight_updates: true
  verify_weights: false
  raiden:
    data_nics: "eth0"
    multi_numa: false

# The orchestrator loads the DeepSWE task records (`data_config.dataset_path`,
# set on the command line) with `prewarm.create_dataset(**data_config)` and
# prewarms the sandbox pools of upcoming batches (`prewarm.prompt_items_context`).
data_module: "tunix.experimental.examples.deepswe_dist.prewarm"
# Imported by the rollout node to register `DeepSWEEnv` / `CodeActAgent`.
registry_module: "tunix.experimental.examples.deepswe_dist.deepswe"
task_name: "deepswe"
data_config:
  split: "train"
  shuffle: false
  seed: 42
  dataset_name: "R2E-Gym/R2E-Gym-Subset"
  cache_dir: "/tmp/hf_datasets_cache"

batch_size: 16
rl_training_config:
  max_steps: 30
  # Null follows `batch_size` automatically when scaling to 32 or 64.
  mini_batch_size: null
  train_micro_batch_size: 64
  compute_logps_micro_batch_size: 1
  compute_logps_chunk_size: 512
  max_seq_tokens_per_device: 65536
  max_segments_per_packed_row: 16
  actor_optimizer_config:
    opt_type: "adamw"
    learning_rate: 1.0e-6
    # Empty: a constant learning rate.
    schedule_type: ""
    b1: 0.9
    b2: 0.999
    eps: 1.0e-8
    weight_decay: 0.0
    opt_chain_type: "clip_by_global_norm"
    chain_kwargs:
      max_norm: 0.125
  checkpointing_options:
    save_interval_steps: 0
    max_to_keep: 30
  metrics_logging_options:
    project_name: "trellis-deepswe"
    flush_every_n_steps: 1

dist_training_config:
  precompile_trainer: true
  segment_alignment_boundary: 64
  ckpt_d2h_concurrent_gb: 32
  trajectory_logging: false
  # The trainer has no keys for `float32_gate_logits` / `float32_logits`; keep
  # them equal to `rollout_model_config.kwargs`.
  maxtext_extra_config:
    custom_mesh_and_rule: cp-as-ep
    remat_policy: custom
    gdn_cp_mode: seq
    gdn_cp_state: device
    gdn_chunk_size: 64
    decoder_layer_input: device
    context: remat
    gdn: remat
    gdn_states: remat
    moe_routing_maps: device
    megablox: true
    sparse_matmul: true
    use_tokamax_gmm: true
    use_gmm_v2: true
    use_gmm_v2_heuristic_tiling: false
    merge_gating_gmm: false
    moe_gmm_v2_dlhs_transpose_rhs: true
    wi_tile_fwd_batch_seq: 256
    wi_tile_fwd_embed_dim: 4096
    wi_tile_fwd_mlp_dim: 1024
    wi_tile_dlhs_batch_seq: 256
    wi_tile_dlhs_embed_dim: 4096
    wi_tile_dlhs_mlp_dim: 2048
    wi_tile_drhs_batch_seq: 256
    wi_tile_drhs_embed_dim: 4096
    wi_tile_drhs_mlp_dim: 1024
    wo_tile_fwd_batch_seq: 256
    wo_tile_fwd_embed_dim: 4096
    wo_tile_fwd_mlp_dim: 1024
    wo_tile_dlhs_batch_seq: 256
    wo_tile_dlhs_embed_dim: 4096
    wo_tile_dlhs_mlp_dim: 1024
    wo_tile_drhs_batch_seq: 256
    wo_tile_drhs_embed_dim: 4096
    wo_tile_drhs_mlp_dim: 1024
    use_ring_of_experts: true
    num_moe_token_chunks: 2
    moe_chunk_barrier: false
    use_ragged_sort: true
    moe_tc_ragged_sort: true
    use_custom_sort_vjp: false
    ragged_buffer_factor: 2.75
    use_tokamax_splash: true
    use_splash_scheduler: false
    sa_block_q: 1024
    sa_block_kv: 4096
    sa_block_kv_compute: 512
    sa_block_q_dkv: 1024
    sa_block_kv_dkv: 1024
    sa_block_kv_dkv_compute: 512
    sa_fuse_reciprocal: true
    sa_use_base2_exp: true
    dq_reduction_steps: 3
    context_parallel_strategy: all_gather
    context_parallel_load_balance: false
    allow_split_physical_axes: false
    num_vocab_tiling: 16
    use_iota_embed: false
    mu_dtype: float32
    grad_dtype: float32
    checkpoint_storage_concurrent_gb: 96
    checkpoint_storage_use_ocdbt: false
    checkpoint_storage_use_zarr3: false
    packing: true
    optimizer_memory_host_offload: true
    float32_gate_logits: true
    float32_logits: true
    trainable_parameters_mask: "^(?!.*routed_experts/gate/kernel).*"
    kv_tp_size: 8
    rollout_fp8_moe: true
    fp8_moe_fake_quant: true

agentic_grpo_config:
  num_generations: 16
  beta: 0.0
  epsilon: 0.2
  epsilon_high: 0.28
  loss_algo: "grpo"
  loss_agg_mode: "token-mean"
  kl_loss_mode: "kl"
  advantage_estimator: "grpo-loo"
  sampler_is: "token"
  sampler_is_threshold: null
  sampler_rs: "geometric"
  sampler_rs_min: 0.999
  sampler_rs_max: 1.002
  seq_logprob_error_threshold: 2.0
  use_rollout_logps: true
  max_concurrency: 512
  off_policy_steps: 1
  max_version_span: 2
  trajectory_group_order: "trajectory_completion"
  reward_mode: "env"
  episode_timeout: 1800
  # Keep equal to `env_kwargs.max_steps`.
  max_turns: 30
  overlong_filter: false

reward_functions: []

env_class_path: "deepswe_env"
env_kwargs:
  # Keep equal to `agentic_grpo_config.max_turns`.
  max_steps: 30
  step_timeout: 60
  reward_timeout: 60
  backend: "kubernetes-sandbox"
  use_agent_sandbox: true
  scaffold: "openhands"
  verbose: false

agent_class_path: "codeact_agent"
agent_kwargs:
  scaffold: "openhands"

# Sandbox pod placement; `namespace: null` follows `cluster_config.k8s.namespace`.
kubernetes_config:
  namespace: null
  node_selector_key: "workload"
  node_selector_val: "sandbox"

cluster_config:
  target: "k8s"
  artifact_root: "artifacts/deepswe"
  debug: false
  rpc_timeout_s: 10800
  init_timeout_s: 7200
  rollout_replicas: 32
  k8s:
    namespace: "default"
    service_account: "xpk-sa"
    priority_class: "medium"
    fail_fast: true
    startup_retries: 3
    teardown_gang_on_exit: true
    use_dynamic_slicing: true
    head_nodepool: "cpu-np"
    cpu_machine: "c3d-standard-60"
    jax_cache:
      local_dir: "/tmp/jax_cache"
    trainer:
      jobset_yaml: "jobset.pathways.yaml"
      tpu_slice: "tpu7x:4x4x8"
    rollout:
      jobset_yaml: "jobset.tpu.yaml"
      tpu_slice: "tpu7x:2x2x1"
  pathways:
    proxy_memory:
      request: "16G"
      limit: "160G"
    rm_memory:
      request: "4G"
      limit: "32G"
    server_memory:
      request: "100G"
      limit: ""
    trainer:
      persistence: true
      # Routes host buffers of 16 MiB or more through shared memory.
      ifrt_proxy_large_transfer_threshold_bytes: 16777216
    # `mlperf_397b_256_v7x.sh` adds `LIBTPU_INIT_ARGS` and sets
    # `proxy_extra_args` from its libtpu flag list.
    worker_env:
      SKIP_MEGASCALE_PJRT_CLIENT: "true"
      RAIDEN_PARALLELISM: "16"
      RAIDEN_TRANSPORT_COALESCE_WINDOW_BYTES: "67108864"
      RAIDEN_WEIGHT_SYNC_PIPELINE_GROUP_SIZE: "16"
      RAIDEN_BROADCAST_HOST_RATIO: "1.0"
      RAIDEN_BROADCAST_PIPELINE_STAGES: "4"
      TPU_RAIDEN_CONTROL_PLANE_BACKEND: "tcp"
      TPU_RAIDEN_TCP_CONNECT_TIMEOUT_MS: "120000"
      TPU_RAIDEN_TCP_CONNECT_MAX_ATTEMPTS: "5"
  roles:
    orchestrator:
      port: 20000
      memory:
        request: "220Gi"
        limit: ""
      env:
        RAIDEN_PARALLELISM: "16"
        RAIDEN_BROADCAST_HOST_RATIO: "1.0"
        RAIDEN_BROADCAST_PIPELINE_STAGES: "4"
        TPU_RAIDEN_CONTROL_PLANE_BACKEND: "tcp"
        TPU_RAIDEN_TCP_CONNECT_TIMEOUT_MS: "120000"
        TPU_RAIDEN_TCP_CONNECT_MAX_ATTEMPTS: "5"
        SANDBOX_IMAGE_PULL_POLICY: "IfNotPresent"
        SANDBOX_TOLERATIONS: '[{"key":"workload","operator":"Equal","value":"sandbox","effect":"NoSchedule"}]'
    trainer:
      port: 20002
      # With `use_dynamic_slicing: true`, the Pathways head pod lands on
      # `cpu-np` (~257G allocatable), so keep `request` modest (`48G`) while
      # leaving the burstable `limit` at `260G`.
      memory:
        request: "48G"
        limit: "260G"
      env:
        HF_HOME: "/dev/shm/hf"
        ONEHOT_MOE_PERMUTE_THRESHOLD: "2048"
        RAIDEN_PARALLELISM: "16"
        RAIDEN_TRANSPORT_COALESCE_WINDOW_BYTES: "67108864"
        RAIDEN_WEIGHT_SYNC_PIPELINE_GROUP_SIZE: "16"
        RAIDEN_BROADCAST_HOST_RATIO: "1.0"
        RAIDEN_BROADCAST_PIPELINE_STAGES: "4"
        RAIDEN_FFI_USE_DIRECT_DEVICE_BUFFER: "0"
        TPU_RAIDEN_CONTROL_PLANE_BACKEND: "tcp"
        TPU_RAIDEN_TCP_CONNECT_TIMEOUT_MS: "120000"
        TPU_RAIDEN_TCP_CONNECT_MAX_ATTEMPTS: "5"
    rollout:
      port: 20001
      env:
        HF_HOME: "/dev/shm/hf"
        RAIDEN_DEVICES_PER_HOST: "8"
        NUM_PRECOMPILE_WORKERS: "8"
        NEW_MODEL_DESIGN: "1"
        ATTN_BUCKETIZED_NUM_REQS: "true"
        ATTN_CUSTOM_NUM_REQS_BUCKETS: "4"
        ONEHOT_MOE_PERMUTE_THRESHOLD: "2048"
        RAGGED_GATHER_REDUCE_VERSION: "v3"
        VLLM_MOE_CHUNK_SIZE: "256"
        SLICE_ROPE_CACHE: "1"
        DP_SCHED_BATCH_PREFILL: "false"
        VLLM_LOGGING_LEVEL: "INFO"
        TPU_SMALL_ALL_REDUCE: "1"
        TPU_MOE_SINGLE_SORT: "1"
        TPU_MOE_ROUTER_TOPK: "rowmax"
        TPU_MOE_LOWTOK: "1"
        RAY_memory_monitor_refresh_ms: "0"
        RAIDEN_TRANSPORT_COALESCE_WINDOW_BYTES: "67108864"
        RAIDEN_WEIGHT_SYNC_PIPELINE_GROUP_SIZE: "16"
        RAIDEN_PARALLELISM: "16"
        VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
        RAIDEN_BROADCAST_HOST_RATIO: "1.0"
        RAIDEN_BROADCAST_PIPELINE_STAGES: "4"
        TPU_RAIDEN_CONTROL_PLANE_BACKEND: "tcp"
        TPU_RAIDEN_TCP_CONNECT_TIMEOUT_MS: "120000"
        TPU_RAIDEN_TCP_CONNECT_MAX_ATTEMPTS: "5"
        LIBTPU_INIT_ARGS: >-
          --xla_tpu_use_minor_sharding_for_major_trivial_input=true
          --xla_tpu_enable_sparse_core_collective_offload_reduce_scatter=false
          --xla_tpu_ars_combiner_threshold_in_bytes=0
          --xla_tpu_enable_async_collective_merger=false
          --xla_tpu_check_legacy_constraints_in_reduce_scatter_legalizer=false
          --xla_tpu_dvfs_p_state=7
        OPENHANDS_MULTI_TOOL_CALLS: "true"
        SANDBOX_IMAGE_PULL_POLICY: "IfNotPresent"
        SANDBOX_TOLERATIONS: '[{"key":"workload","operator":"Equal","value":"sandbox","effect":"NoSchedule"}]'
