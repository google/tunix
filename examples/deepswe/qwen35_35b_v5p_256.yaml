apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  namespace: trellis
  labels:
    kueue.x-k8s.io/priority-class: medium
    kueue.x-k8s.io/queue-name: multislice-queue
    xpk.google.com/workload: sb-35b-v5p-op
  name: sb-35b-v5p-op
spec:
  failurePolicy:
    maxRestarts: 3
    restartStrategy: Recreate
  coordinator:
    replicatedJob: pathways-head
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
  replicatedJobs:
  - name: pathways-head
    replicas: 1
    template:
      spec:
        backoffLimit: 3
        completionMode: Indexed
        completions: 1
        parallelism: 1
        template:
          metadata:
            annotations:
              cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
          spec:
            serviceAccountName: xpk-sa
            priorityClassName: medium
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                    - key: jobset.sigs.k8s.io/replicatedjob-name
                      operator: In
                      values:
                      - pathways-head
                  namespaceSelector: {}
                  topologyKey: kubernetes.io/hostname
            nodeSelector:
              cloud.google.com/gke-nodepool: cpu-np
            tolerations:
            - key: google.com/tpu
              operator: Exists
            - effect: NoExecute
              key: node.kubernetes.io/not-ready
              operator: Exists
              tolerationSeconds: 900
            - effect: NoExecute
              key: node.kubernetes.io/unreachable
              operator: Exists
              tolerationSeconds: 900
            - effect: NoSchedule
              key: cloud.google.com/gke-nodepool
              operator: Equal
              value: cpu-np
            dnsPolicy: ClusterFirstWithHostNet
            hostNetwork: true
            initContainers:
            - name: pathways-proxy
              image: us-docker.pkg.dev/cloud-tpu-v2-images/pathways/proxy_server:20260730-jax_0.10.2
              imagePullPolicy: Always
              restartPolicy: Always
              args:
              - --server_port=29000
              - --resource_manager_address=$(PATHWAYS_HEAD):29001
              - --gcs_scratch_location=gs://cloud-pathways-staging/tmp/sb-35b-v5p-op
              env:
              - name: PATHWAYS_HEAD
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/coordinator']
              - name: ENABLE_PATHWAYS_PERSISTENCE
                value: '1'
              ports:
              - containerPort: 29000
                protocol: TCP
              resources:
                limits:
                  cpu: '64'
                  memory: 400Gi
                requests:
                  cpu: '6'
                  memory: 24Gi
            - name: pathways-rm
              image: us-docker.pkg.dev/cloud-tpu-v2-images/pathways/server:20260730-jax_0.10.2
              imagePullPolicy: Always
              restartPolicy: Always
              args:
              - --server_port=29001
              - --gcs_scratch_location=gs://cloud-pathways-staging/tmp/sb-35b-v5p-op
              - --node_type=resource_manager
              - --instance_count=1
              - --instance_type=tpuv5:4x4x8
              env:
              - name: HOST_ADDRESS
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/coordinator']
              - name: TPU_SKIP_MDS_QUERY
                value: 'true'
              - name: ENABLE_PATHWAYS_PERSISTENCE
                value: '1'
              - name: XLA_FLAGS
                value: --xla_dump_to=gs://sanbao-europe/mlperf/qwen35_35b/v5p-256/xla-dumps/qwen-35b-deepswe-v5p-256 --xla_dump_hlo_as_text --xla_dump_hlo_as_proto
              ports:
              - containerPort: 29001
                protocol: TCP
              - containerPort: 29002
                protocol: TCP
              resources:
                limits:
                  cpu: '64'
                  memory: 400Gi
                requests:
                  cpu: '4'
                  memory: 16Gi
            containers:
            - name: jax-tpu
              image: gcr.io/cloud-tpu-multipod-dev/sanbao/tunix_stack:openhands
              imagePullPolicy: Always
              command:
              - bash
              - -c
              - |
                echo PYTHONPATH=$PYTHONPATH;
                python3 -c "import sys; print('sys.path:', sys.path)";
                echo XPK Start: $(date);
                _sigterm() (kill -SIGTERM $! 2>/dev/null;);
                trap _sigterm SIGTERM;
                (bash -c '(python3 examples/deepswe/train_maxtext_nb.py \
                  --model_version Qwen3.5-35B-A3B \
                  --model_absolute_path gs://niting-storage-europe-west4/qwen3.5-35b-a3b/scanned/0/items \
                  --scan_layers True \
                  --vllm_utilization 0.70 \
                  --max_response_length 16384 \
                  --max_prompt_length 4096 \
                  --metric_logger_dir gs://sanbao-europe/mlperf/qwen35_35b/v5p-256/deepswe-logs/qwen-35b-deepswe-v5p-256 \
                  --vllm_reshard_chunk_size 1 \
                  --rollout_mesh_fsdp 16 \
                  --rollout_mesh_tp 4 \
                  --train_mesh_fsdp 32 \
                  --train_mesh_tp 2 \
                  --node_selector_val sandbox-cpu-pool \
                  --max_steps 5 \
                  --rollout_micro_batch_size 32 \
                  --max_concurrency 64 \
                  --max_warmpool_size 1 \
                  --max_num_batched_tokens 32768 \
                  --overlong_filter False \
                  --save_interval_steps 5 \
                  --batch_size 32 \
                  --mini_batch_size 32 \
                  --compute_logps_micro_batch_size 4 \
                  --train_micro_batch_size 4 \
                  --use_flash_attention True \
                  --enable_jax_profiler True \
                  --jax_profiler_port 9999 \
                  --temperature 0.7 \
                  --num_generations 8 \
                  --max_turns 30 \
                  --step_timeout_secs 60 \
                  --reward_timeout_secs 180 \
                  --per_turn_timeout_secs 60 \
                  --episode_timeout_secs 3600 \
                  --beta 0.001 \
                  --weight_decay 0.1 \
                  --max_grad_norm 0.1 \
                  --checkpoint_storage_use_ocdbt True \
                  --checkpoint_storage_use_zarr3 False \
                  --logging_level INFO \
                  --remat_policy decoder \
                  --docker_image_prefix europe-west4-docker.pkg.dev/cloud-tpu-multipod-dev/tunix \
                  --use_agent_sandbox) > >(tee -a /proc/1/fd/1 /tmp/combined.log) 2> >(tee -a /proc/1/fd/2 /tmp/combined.log >&2)') & PID=$!;
                while kill -0 $PID 2>/dev/null;
                    do sleep 5;
                done;
                wait $PID;
                EXIT_CODE=$?;
                echo XPK End: $(date);
                echo EXIT_CODE=$EXIT_CODE;
                exit $EXIT_CODE
              env:
              - name: PATHWAYS_HEAD
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/coordinator']
              - name: JAX_PLATFORMS
                value: proxy,cpu
              - name: VLLM_ENABLE_V1_MULTIPROCESSING
                value: '0'
              - name: NEW_MODEL_DESIGN
                value: '1'
              - name: VLLM_TPU_USING_PATHWAYS
                value: '1'
              - name: TOKENIZERS_PARALLELISM
                value: 'false'
              - name: XCLOUD_ENVIRONMENT
                value: GCP
              - name: JAX_BACKEND_TARGET
                value: grpc://$(PATHWAYS_HEAD):29000
              - name: TPU_MIN_LOG_LEVEL
                value: '0'
              - name: TF_CPP_MIN_LOG_LEVEL
                value: '0'
              - name: TPU_STDERR_LOG_LEVEL
                value: '0'
              - name: NUM_SLICES
                value: '1'
              - name: PYTHONPATH
                value: /app
              - name: WANDB_API_KEY
                value: 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
              - name: SKIP_JAX_PRECOMPILE
                value: 'true'
              - name: XLA_PYTHON_CLIENT_PREALLOCATE
                value: 'false'
              - name: TPU_FLAGS
                value: tpu_program_cache_eviction_policy=lru_program_eviction
              - name: ENABLE_PATHWAYS_PERSISTENCE
                value: '1'
              - name: XLA_FLAGS
                value: --xla_dump_to=gs://sanbao-europe/mlperf/qwen35_35b/v5p-256/xla-dumps/qwen-35b-deepswe-v5p-256 --xla_dump_hlo_as_text --xla_dump_hlo_as_proto
              - name: NODE_SELECTOR_KEY
                value: cloud.google.com/gke-nodepool
              - name: NODE_SELECTOR_VAL
                value: sandbox-cpu-pool
              - name: NAMESPACE
                value: trellis
              - name: OPENHANDS_SUPPRESS_BANNER
                value: '1'
              - name: AGENT_SERVER_IMAGE
                value: ghcr.io/openhands/agent-server:1.44.1-python
              - name: USE_MOE_EP_KERNEL
                value: '0'
              - name: ATTN_BUCKETIZED_NUM_REQS
                value: 'true'
              - name: ATTN_CUSTOM_NUM_REQS_BUCKETS
                value: '4'
              - name: ONEHOT_MOE_PERMUTE_THRESHOLD
                value: '32768'
              - name: VLLM_MOE_CHUNK_SIZE
                value: '256'
              - name: SLICE_ROPE_CACHE
                value: '1'
              - name: DP_SCHED_BATCH_PREFILL
                value: 'false'
              - name: NUM_PRECOMPILE_WORKERS
                value: '8'
              resources:
                limits:
                  cpu: '32'
                  memory: 200Gi
                requests:
                  cpu: '16'
                  memory: 48Gi
              securityContext:
                privileged: true
              volumeMounts:
              - mountPath: /tmp
                name: shared-tmp
              - mountPath: /app/models
                name: model-volume
            volumes:
            - hostPath:
                path: /tmp
                type: DirectoryOrCreate
              name: shared-tmp
            - emptyDir:
                medium: Memory
              name: model-volume
  - name: worker
    replicas: 1
    template:
      spec:
        backoffLimit: 0
        completionMode: Indexed
        completions: 32
        parallelism: 32
        template:
          metadata:
            annotations:
              cloud.google.com/gke-tpu-slice-topology: 4x4x8
              cloud.google.com/skip-tpu-webhook-check: 'true'
              cluster-autoscaler.kubernetes.io/safe-to-evict: 'false'
            labels:
              xpk.google.com/workload: sb-35b-v5p-op
          spec:
            serviceAccountName: xpk-sa
            priorityClassName: medium
            restartPolicy: OnFailure
            terminationGracePeriodSeconds: 30
            dnsPolicy: ClusterFirstWithHostNet
            hostNetwork: true
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu-v5p-slice
              cloud.google.com/gke-tpu-topology: 4x4x8
              cloud.google.com/reservation-name: cloudtpu-20260902214500-1810493672
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                  - matchExpressions:
                    - key: cloud.google.com/gke-tpu-topology
                      operator: In
                      values:
                      - 4x4x8
              podAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: cloud.google.com/gke-nodepool
                  labelSelector:
                    matchExpressions:
                    - key: jobset.sigs.k8s.io/jobset-name
                      operator: In
                      values:
                      - sb-35b-v5p-op
                    - key: jobset.sigs.k8s.io/replicatedjob-name
                      operator: In
                      values:
                      - worker
            tolerations:
            - key: google.com/tpu
              operator: Exists
            - effect: NoSchedule
              key: google.com/tpu
              operator: Exists
            - effect: NoExecute
              key: node.kubernetes.io/not-ready
              operator: Exists
              tolerationSeconds: 900
            - effect: NoExecute
              key: node.kubernetes.io/unreachable
              operator: Exists
              tolerationSeconds: 900
            - effect: NoSchedule
              key: cloud.google.com/reservation-name
              operator: Equal
              value: cloudtpu-20260902214500-1810493672
            containers:
            - name: pathways-worker
              image: us-docker.pkg.dev/cloud-tpu-v2-images/pathways/server:20260730-jax_0.10.2
              imagePullPolicy: Always
              args:
              - --server_port=29005
              - --resource_manager_address=$(PATHWAYS_HEAD):29001
              - --gcs_scratch_location=gs://cloud-pathways-staging/tmp/sb-35b-v5p-op
              - --node_type=worker
              - --instance_type=tpuv5:4x4x8
              env:
              - name: ENABLE_PATHWAYS_PERSISTENCE
                value: '1'
              - name: TPU_MIN_LOG_LEVEL
                value: '0'
              - name: TF_CPP_MIN_LOG_LEVEL
                value: '0'
              - name: XCLOUD_ENVIRONMENT
                value: GCP
              - name: MEGASCALE_GRPC_ENABLE_XOR_TRACER
                value: 'false'
              - name: MEGASCALE_NUM_SLICES
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/replicatedjob-replicas']
              - name: JOBSET_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.annotations['jobset.sigs.k8s.io/jobset-name']
              - name: REPLICATED_JOB_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.annotations['jobset.sigs.k8s.io/replicatedjob-name']
              - name: MEGASCALE_SLICE_ID
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/job-index']
              - name: PATHWAYS_HEAD
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/coordinator']
              - name: MEGASCALE_COORDINATOR_ADDRESS
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/coordinator']
              - name: XLA_PYTHON_CLIENT_PREALLOCATE
                value: 'false'
              - name: TPU_FLAGS
                value: tpu_program_cache_eviction_policy=lru_program_eviction
              - name: XLA_FLAGS
                value: --xla_dump_to=gs://sanbao-europe/mlperf/qwen35_35b/v5p-256/xla-dumps/qwen-35b-deepswe-v5p-256 --xla_dump_hlo_as_text --xla_dump_hlo_as_proto
              - name: LIBTPU_INIT_ARGS
                value: ' --xla_tpu_use_minor_sharding_for_major_trivial_input=true --xla_tpu_enable_sparse_core_collective_offload_reduce_scatter=false --xla_tpu_ars_combiner_threshold_in_bytes=0 --xla_tpu_enable_async_collective_merger=false --xla_tpu_check_legacy_constraints_in_reduce_scatter_legalizer=false'
              ports:
              - containerPort: 29005
                protocol: TCP
              - containerPort: 29006
                protocol: TCP
              - containerPort: 8471
                protocol: TCP
              - containerPort: 8080
                protocol: TCP
              resources:
                limits:
                  google.com/tpu: '4'
                requests:
                  google.com/tpu: '4'
              volumeMounts:
              - mountPath: /tmp
                name: shared-tmp
            volumes:
            - hostPath:
                path: /tmp
                type: DirectoryOrCreate
              name: shared-tmp
  startupPolicy:
    startupPolicyOrder: InOrder
  successPolicy:
    operator: All
    targetReplicatedJobs:
    - pathways-head
  suspend: false
