# Monolithic agentic GRPO FrozenLake recipe for Qwen3.5-0.8B (and Qwen3.5-2B).
# Topology (5+ TPU chips): 4-way FSDP actor/reference mesh `(4,1)` + dedicated
# 1-chip `TP=1` vLLM rollout mesh `(1,1)`. Uses `load_dtype: "float32"` to
# preserve Gated DeltaNet `A_log` precision and avoid bf16 AdamW update
# underflow, and `enable_thinking: False` so turns emit actions directly.
model_config:
  model_name: "Qwen3.5-0.8B"
  model_id: "Qwen/Qwen3.5-0.8B"
  model_source: "huggingface"
  model_path: ""
  mesh:
    shape: "(4,1)"
    axis_names: "('fsdp','tp')"
  remat_config: "DECODER"
  use_flash_attention: True
  flash_attention_block_size: 256
  dtype: "bfloat16"
  rng_seed: 42
actor_model_config:
  load_dtype: "float32"
  mesh:
    shape: "(4,1)"
    axis_names: "('fsdp','tp')"
reference_model_config:
  load_dtype: "float32"
  mesh: null
  same_mesh_as: "actor"
rollout_model_config:
  mesh:
    shape: "(1,1)"
    axis_names: "('fsdp','tp')"
tokenizer_config:
  tokenizer_type: "huggingface"
  tokenizer_path: "Qwen/Qwen3.5-0.8B"
  add_bos: False
  add_eos: False

# Agentic GRPO configuration
training_mode: "agentic_grpo"
agent_class_path: "examples.frozenlake.agent.FrozenLakeAgent"
agent_kwargs:
  use_multistep_prompt: True
env_class_path: "examples.frozenlake.env.FrozenLakeEnv"
env_kwargs:
  max_steps: 8

data_module: "examples.frozenlake.data"
data_config:
  split: "train"
  shuffle: True
  seed: 42
  data_dir: "/tmp/data/frozenlake"

chat_parser_config:
  type: "qwen"
  enable_thinking: False

batch_size: 64
num_batches: 5
num_test_batches: 2
num_train_epochs: 1

rl_training_config:
  mini_batch_size: 64
  train_micro_batch_size: 4
  actor_optimizer_config:
    opt_type: "adamw"
    learning_rate: 1e-6
    b1: 0.9
    b2: 0.95
    weight_decay: 0.0
    opt_chain_type: "clip_by_global_norm"
    chain_kwargs:
      max_norm: 1.0
  eval_every_n_steps: 10
  metrics_logging_options:
    log_dir: "/tmp/logging"
    flush_every_n_steps: 1
  checkpointing_options:
    save_interval_steps: 50
    max_to_keep: 4
  profiler_options: {}
  compute_logps_chunk_size: 1024

rollout_config:
  total_generation_steps: 2048
  max_prompt_length: 2048
  temperature: 0.7
  top_p: 1.0
  top_k: 0
  return_logprobs: True
  rollout_vllm_init_with_random_weights: True

rollout_engine: "vllm"

vllm_config:
  model_version: "Qwen/Qwen3.5-0.8B"
  hbm_utilization: 0.5
  tpu_backend_type: "jax"
  server_mode: True
  async_scheduling: False
  max_num_seqs: 64
  max_num_batched_tokens: 8192
  data_parallel_size: 1
  tensor_parallel_size: 1
  kwargs:
    kv_cache_metrics: True
    disable_log_stats: False
    enable_prefix_caching: False
    dtype: "bfloat16"
    hf_overrides:
      architectures: ["Qwen3_5ForCausalLM"]

offload_to_cpu: False

reward_functions: []

agentic_grpo_config:
  num_generations: 8
  num_iterations: 1
  beta: 0.0
  epsilon: 0.003
  epsilon_high: 0.005
  loss_algo: "gspo-token"
  loss_agg_mode: "sequence-mean-token-mean"
  kl_loss_mode: "low_var_kl"
  advantage_estimator: "rloo"
  sampler_is: "token"
  sampler_is_threshold: 2.0
  max_concurrency: 256
