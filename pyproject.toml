[project]
name = "google-tunix"
version = "0.1.8"
authors = [
  { name = "Tunix Developers", email = "tunix-dev@google.com" },
]
description = "A lightweight JAX-native LLM post-training framework."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Apache-2.0" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "datasets>=3.0.0",
  "flax>=0.12.5",
  "fsspec",  # notebook dependency
  "google-metrax>=0.2.3",
  "grain",
  "hf_transfer",  # Huggingface caching in CI
  "huggingface_hub",
  "importlib_resources",
  # Jax 0.7.2 has performance regression on OSS
  # Jax 0.11.1 removed jax.experimental.hijax.MutableHiType, which flax (through 0.12.8, the newest release) still subclasses
  "jax[tpu]>=0.6.0,!=0.7.2,<0.11.1",
  "jaxtyping",
  "jinja2",  # Huggingface chat template
  "kagglehub",
  "numba",
  "omegaconf", # CLI config
  "orbax-checkpoint>=0.12.0",
  "pillow",  # Image processing
  "pylatexenc",  # Eval result parsing
  "python-dotenv",  # Huggingface API key
  "perfetto",  # Perfetto trace writer for metrics export
  "qwix>=0.1.6",
  "sentencepiece",
  "safetensors<0.8", # higher versions breaks with jax >=0.9
  "sqlalchemy",
  "sympy",  # Eval result parsing
  "tensorflow_datasets",
  "tqdm",
  "transformers!=4.57.2", # Issue: https://github.com/google/tunix/pull/795
  "tenacity",
]

[project.optional-dependencies]
docs = [
    "sphinx>=8.2.3",
    "sphinx-book-theme>=1.1.4",  # Older versions fail to pin pydata-sphinx-theme
    "sphinx-autodoc-typehints",
    "ipython>=8.8.0",  # 8.7.0 has ipython3 lexer error
    "myst-nb>=1.3.0",
    "matplotlib>=3.10.0",
    "sphinx-gallery>=0.19.0",
    "sphinx-collections>=0.0.1",
    "sphinx_contributors",
]
prod = [
]
dev = [
  "google-tunix[test,experimental]",
]
test = [
  "pytest",
  "pytest-xdist",
  "gcsfs",
  "chex",
  "opentelemetry-sdk>=1.25.0",
  "wandb",  # Offline end-to-end test for the OpenTelemetry W&B exporter
  "mlperf-logging",
  "kagglesdk",
]
cli = [
  "array_record",
  "gcsfs",
  "tensorflow",
]
otel = [
  # Experimental OpenTelemetry double-write path for MetricsLogger.
  "opentelemetry-api>=1.25.0",
  "opentelemetry-sdk>=1.25.0",
]
frozenlake = [
  "gymnasium",
]
experimental = [
  "cloudpickle",  # serialization envelope for the remote-execution actor protocol
  "grpcio",  # transport for cross-process worker execution
  "grpcio-tools",
  "pydantic",  # data modeling and serialization for agent trajectories
  "simple_parsing",  # Argument parsing for CLI
]
maxtext = [
  "aqtp>=0.9.0",
  "cheroot",
  "cloud-accelerator-diagnostics",
  "cloud-tpu-diagnostics",
  "drjax>=0.1.4",
  "einshape",
  "google-cloud-mldiagnostics>=0.5.10",
  "google-cloud-monitoring",
  "jsonlines",
  "ml-collections",
  "ml-goodput-measurement",
  "optax",
  "pathwaysutils",
  "tensorboard-plugin-profile",
  "tensorboardx",
  "tiktoken",
  "tokamax>=0.0.4",
  "typeguard",
  "xprof",
]

[dependency-groups]
vllm-tpu = [
  "vllm @ git+https://github.com/vllm-project/vllm.git@51da0ca66c8065619c79e35dff97aa99aeaf5644",
]
tpu-inference = [
  "tpu-inference @ git+https://github.com/vllm-project/tpu-inference.git@6f913c734cb47a1125a817e37cc418c5960675d0",
]
maxtext-git = [
  "maxtext @ git+https://github.com/AI-Hypercomputer/maxtext.git@63d5db085447274e9cd8769334866fe5268459a9",
  "maxtext-vllm-adapter @ git+https://github.com/AI-Hypercomputer/maxtext.git@63d5db085447274e9cd8769334866fe5268459a9#subdirectory=src/maxtext/integration/vllm",
  # Installed with --no-deps after [maxtext] because google-cloud-monitoring and
  # tensorflow cap protobuf<7.0.0 in their PyPI metadata, whereas MaxText's
  # generated protos require protobuf>=7.35.1 at runtime.
  "protobuf>=7.35.1",
]
sglang-jax = [
  "sglang-jax @ git+https://github.com/sgl-project/sglang-jax.git@1bdbc6747939c0e600622fc7f812151d76321080#subdirectory=python",
]

[project.urls]
Source = "https://github.com/google/tunix"

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tunix*"]

[tool.pyink]
line-length = 80
unstable = true
target-version = []
pyink-indentation = 2
pyink-use-majority-quotes = true
pyink-annotation-pragmas = [
  "noqa",
  "pylint:",
  "type: ignore",
  "pytype:",
  "mypy:",
  "pyright:",
  "pyre-",
  "@title",
  "@param",
  "@markdown",
  "@tidy",
  "@test",
]
pyink-ipynb-indentation = 2

[tool.isort]
profile = "google"       # or "black", etc.
known_third_party = ["tunix"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
# Prevent transitive dependencies (`tensorflow`, `aqtp`, `vllm`) from
# downgrading `flax`/`protobuf` or upgrading `numpy` past `2.3.5` when
# `uv` resolves from `pyproject.toml`.
override-dependencies = [
  "flax>=0.12.5",
  "numpy==2.3.5",
  "protobuf>=7.35.1",
]
