[project]
name = "google-tunix"
version = "0.1.8"
authors = [
  { name = "Tunix Developers", email = "tunix-dev@google.com" },
]
description = "A lightweight JAX-native LLM post-training framework."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Apache-2.0" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "datasets>=3.0.0",
  "flax>=0.12.5",
  "fsspec",  # notebook dependency
  "google-metrax>=0.2.3",
  "grain",
  "hf_transfer",  # Huggingface caching in CI
  "huggingface_hub",
  "importlib_resources",
  # Jax 0.7.2 has performance regression on OSS
  # Jax 0.11.1 removed jax.experimental.hijax.MutableHiType, which flax (through 0.12.8, the newest release) still subclasses
  "jax[tpu]>=0.6.0,!=0.7.2,<0.11.1",
  "jaxtyping",
  "jinja2",  # Huggingface chat template
  "kagglehub",
  "numba",
  "omegaconf", # CLI config
  "orbax-checkpoint>=0.12.0",
  "pillow",  # Image processing
  "pylatexenc",  # Eval result parsing
  "python-dotenv",  # Huggingface API key
  "perfetto",  # Perfetto trace writer for metrics export
  "qwix>=0.1.6",
  "sentencepiece",
  "safetensors<0.8", # higher versions breaks with jax >=0.9
  "sqlalchemy",
  "sympy",  # Eval result parsing
  "tensorflow_datasets",
  "tqdm",
  "transformers!=4.57.2", # Issue: https://github.com/google/tunix/pull/795
  "tenacity",
]

[project.optional-dependencies]
docs = [
    "sphinx>=8.2.3",
    "sphinx-book-theme>=1.1.4",  # Older versions fail to pin pydata-sphinx-theme
    "sphinx-autodoc-typehints",
    "ipython>=8.8.0",  # 8.7.0 has ipython3 lexer error
    "myst-nb>=1.3.0",
    "matplotlib>=3.10.0",
    "sphinx-gallery>=0.19.0",
    "sphinx-collections>=0.0.1",
    "sphinx_contributors",
]
prod = [
]
dev = [
  # Install pinned vLLM & tpu-inference via `bash scripts/install_tunix_vllm_requirement.sh`.
]
tpu = [
  "aqtp",
  "array-record",
  "drjax>=0.2.1",
  "gcsfs",
  "kagglesdk",
  "math_verify",
  "tensorflow",
  "tokamax>=0.0.4",
  "torchax",
]
maxtext = [
  # Install pinned MaxText & maxtext-vllm-adapter git packages via
  # `uv pip install --no-deps --group maxtext-git`.
  "aqtp",
  "cheroot",
  "cloud-accelerator-diagnostics",
  "cloud-tpu-diagnostics",
  "drjax>=0.2.1",
  "einshape",
  "google-cloud-mldiagnostics>=0.5.10",
  "google-cloud-monitoring",
  "jsonlines",
  "ml-collections",
  "ml-goodput-measurement",
  "optax",
  "pathwaysutils",
  "tensorboard-plugin-profile",
  "tensorboardx",
  "tiktoken",
  "tokamax>=0.0.4",
  "typeguard",
  "xprof",
]
deepswe = [
  # Install pinned R2E-Gym & Agent Sandbox git packages via
  # `bash examples/deepswe/install_deepswe.sh`.
  "gym",
  "k8s-agent-sandbox>=0.5.1",
  "kubernetes",
  "openhands-agent-server>=1.44.1",
  "openhands-sdk>=1.44.1",
  "openhands-tools>=1.44.1",
  "openhands-workspace>=1.44.1",
  "swebench==3.0.2",
]
test = [
  "pytest",
  "pytest-asyncio",
  "pytest-xdist",
  "gcsfs",
  "chex",
  "opentelemetry-sdk>=1.25.0",
  "wandb",  # Offline end-to-end test for the OpenTelemetry W&B exporter
  "mlperf-logging",
]
cli = [
  "tensorflow",
]
otel = [
  # Experimental OpenTelemetry double-write path for MetricsLogger.
  "opentelemetry-api>=1.25.0",
  "opentelemetry-sdk>=1.25.0",
]
frozenlake = [
  "gymnasium",
]
experimental = [
  "cloudpickle",  # serialization envelope for the remote-execution actor protocol
  "grpcio",  # transport for cross-process worker execution
  "grpcio-tools",
  "protobuf>=7.35.1",  # required for gRPC discovery_service_pb2 runtime discovery
  "pydantic",  # data modeling and serialization for agent trajectories
  "simple_parsing",  # Argument parsing for CLI
]

# Non-PyPI git-pinned integration groups (PEP 735, installed via `uv pip install --group <name>`).
# Declared in `[dependency-groups]` rather than `[project.optional-dependencies]` so PyPI wheel
# builds (`python -m build`) remain compliant with PEP 440 / PyPI direct-URL restrictions.
# Note: `vllm` and `tpu-inference` commits are pinned in a single place
# (`scripts/install_tunix_vllm_requirement.sh`) so Layer 1 of `Dockerfile` stays cached
# across routine edits to `pyproject.toml`.
[dependency-groups]
maxtext-git = [
  "maxtext @ git+https://github.com/AI-Hypercomputer/maxtext.git@63d5db085447274e9cd8769334866fe5268459a9",
  "maxtext-vllm-adapter @ git+https://github.com/AI-Hypercomputer/maxtext.git@63d5db085447274e9cd8769334866fe5268459a9#subdirectory=src/maxtext/integration/vllm",
]
deepswe-git = [
  "agentic-sandbox-client @ git+https://github.com/kubernetes-sigs/agent-sandbox.git#subdirectory=clients/python/agentic-sandbox-client",
  "agent-sandbox-rl @ git+https://github.com/kubernetes-sigs/agent-sandbox.git#subdirectory=examples/agent-sandbox-rl",
  "r2e-gym @ git+https://github.com/r2e-gym/r2e-gym.git@0d94c4eb9431cd195c55a7ea3abd54006c9a1735",
]

[tool.uv]
# Resolver overrides applied automatically by `uv` when resolving inside this repository:
# Prevents transitive dependencies (e.g., `tensorflow`, `google-cloud-aiplatform`,
# `tpu-inference`) from downgrading `flax` or `protobuf`, or upgrading `numpy` past
# the `==2.3.5` bound required by Numba.
override-dependencies = [
  "flax>=0.12.5",
  "numpy==2.3.5",
  "protobuf>=7.35.1",
]

[project.urls]
Source = "https://github.com/google/tunix"

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tunix*"]

[tool.pyink]
line-length = 80
unstable = true
target-version = []
pyink-indentation = 2
pyink-use-majority-quotes = true
pyink-annotation-pragmas = [
  "noqa",
  "pylint:",
  "type: ignore",
  "pytype:",
  "mypy:",
  "pyright:",
  "pyre-",
  "@title",
  "@param",
  "@markdown",
  "@tidy",
  "@test",
]
pyink-ipynb-indentation = 2

[tool.isort]
profile = "google"       # or "black", etc.
known_third_party = ["tunix"]

[tool.pytest.ini_options]
pythonpath = ["."]
