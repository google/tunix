# Logp-diff / operator-alignment probe launch (Phase 3b — DISAGGREGATED 256).
# Modeled on experimental/deepswe-256-mlperf.yaml (proven pathways scaffolding);
# probe-specific changes vs that file:
#   - git fetch  yuxzhang/logp-diff-probe   (was deepswe-quality-fix)
#   - runs scripts/logp_diff/logp_diff_probe.py  (forward-only; NO training, NO r2egym sandboxes)
#   - SAME topology as deepswe (4x8x8=256) so the probe reproduces the REAL disaggregated
#     two-mesh diff: vLLM on rollout_mesh (fsdp8xtp8, chips 0-63), tunix on train_mesh
#     (fsdp8xtp8, chips 64-127). 128 idle = faithful to prod (deepswe uses 64+64 too).
# _REMOTE_VERIFY_: k8s/pathways infra (images, node pool, mesh, instance_type) mirrors swe — verify on cluster.
#   BIGGEST RISK: vLLM must confine to rollout_mesh (64 chips), not grab all 256 (would collide
#   with tunix on train_mesh). deepswe does this via rl_cluster role_to_mesh; verify standalone.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: logp-diff-probe
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: multislice-queue
spec:
  failurePolicy:
    maxRestarts: 0
  replicatedJobs:
  - name: pathways-head
    replicas: 1
    template:
      spec:
        backoffLimit: 0
        template:
          spec:
            nodeSelector:
              cloud.google.com/gke-nodepool: deepswe-cpu-pool
            hostNetwork: true
            dnsPolicy: ClusterFirstWithHostNet
            restartPolicy: Never
            initContainers:
            - name: pathways-proxy
              image: us-docker.pkg.dev/cloud-tpu-v2-images/pathways/proxy_server:20260507-jax_0.9.1
              args:
                - --server_port=29000
                - --resource_manager_address=localhost:29001
                - --gcs_scratch_location=gs://yuxzhang-tunix-models/tmp
              env:
                - name: PATHWAYS_HEAD
                  value: localhost
              resources:
                limits: {cpu: '16', memory: 300G}
              volumeMounts:
              - {mountPath: /root/.config/gcloud, name: gcloud-adc}
              restartPolicy: Always
            - name: pathways-rm
              image: us-docker.pkg.dev/cloud-tpu-v2-images/pathways/server:20260507-jax_0.9.1
              args:
                - --server_port=29001
                - --gcs_scratch_location=gs://yuxzhang-tunix-models/tmp
                - --node_type=resource_manager
                - --instance_count=1
                - --instance_type=tpuv5:4x8x8   # 256 chips = deepswe topology (disaggregated 64+64, 128 idle)
              env:
                - {name: HOST_ADDRESS, value: localhost}
                - {name: TPU_SKIP_MDS_QUERY, value: 'true'}
              resources:
                limits: {cpu: '8', memory: 100G}
              volumeMounts:
              - {mountPath: /root/.config/gcloud, name: gcloud-adc}
              restartPolicy: Always
            containers:
            - name: jax-tpu
              image: europe-west4-docker.pkg.dev/cloud-tpu-multipod-dev/yuxzhang-repo/tunix_base_image:latest
              imagePullPolicy: Always
              command:
              - bash
              - -c
              - |
                set -e
                echo "Syncing probe code ..."
                git config --global --add safe.directory $(pwd)
                git init
                git remote set-url origin https://github.com/google/tunix.git 2>/dev/null || git remote add origin https://github.com/google/tunix.git
                git fetch origin yuxzhang/logp-diff-probe
                git reset --hard FETCH_HEAD

                # pathwaysutils hot-patch (same as swe)
                sed -i 's/^from __future__ import annotations/from __future__ import annotations\nimport pathwaysutils\ntry:\n    pathwaysutils.initialize()\nexcept Exception: pass/' scripts/logp_diff/logp_diff_probe.py || true
                # tpu-inference qwen3 ROPE hot-patch (same as swe; probe uses the same vLLM/tpu_inference)
                # _REMOTE_VERIFY_: reuse the /tmp/patch_qwen3.py block from deepswe-256-mlperf.yaml if source B (vLLM) is used.

                sleep 30
                export RUN_TAG="logp_diff_$(date +%Y%m%d_%H%M%S)"
                export MODEL_BASE_DIR="/mnt/disks/linchai_data/models"

                JAX_PLATFORMS=proxy,cpu JAX_BACKEND_TARGET=grpc://127.0.0.1:29000 ENABLE_PATHWAYS_PERSISTENCE='1' \
                NUM_SLICES=1 VLLM_ENABLE_V1_MULTIPROCESSING=0 NEW_MODEL_DESIGN=1 PYTHONUNBUFFERED=1 \
                HF_TOKEN=$(echo -n $INJECTED_HF_TOKEN | xargs) \
                PYTHONPATH=$PYTHONPATH:.:scripts/logp_diff python3 scripts/logp_diff/logp_diff_probe.py \
                  --model_path="$MODEL_BASE_DIR/Qwen3-32B" \
                  --model_version="Qwen3-32B" \
                  --dataset="SWE-bench/SWE-smith-trajectories" \
                  --n_prompt=2048 --n_gen=512 \
                  --rollout_mesh_tp=8 --rollout_mesh_fsdp=8 \
                  --train_mesh_tp=8 --train_mesh_fsdp=8 \
                  --temperature=1.0 \
                  --param_dtype=float32 --config_dtype=bfloat16 \
                  --vllm_hbm_util=0.6 --vllm_max_num_seqs=64 --vllm_max_num_batched_tokens=8192 \
                  --pairs="A-vs-C,A-vs-B,B-vs-C" \
                  --mesh_sensitivity \
                  --out="gs://yuxzhang-tunix-models/logp-diff/${RUN_TAG}/report.json"
              env:
                - {name: INJECTED_HF_TOKEN, valueFrom: {secretKeyRef: {name: yuxzhang-secrets, key: HF_TOKEN, optional: true}}}
              resources:
                limits: {cpu: '16', memory: 300G}
              volumeMounts:
              - {mountPath: /root/.config/gcloud, name: gcloud-adc}
              - {mountPath: /mnt/disks/linchai_data, name: data}
            volumes:
            - {name: gcloud-adc, secret: {secretName: gcloud-adc-secret}}
            - {name: data, persistentVolumeClaim: {claimName: haoyugao-cpu-np-pvc}}
  - name: pathways-worker
    replicas: 1
    template:
      spec:
        backoffLimit: 100
        completions: 64          # 256 chips / 4 per v5p host = 64 hosts (mirrors deepswe-256-mlperf)
        parallelism: 64
        completionMode: Indexed
        template:
          spec:
            containers:
            - name: pathways-worker
              image: us-docker.pkg.dev/cloud-tpu-v2-images/pathways/server:20260507-jax_0.9.1
              args:
                - --server_port=29000
                - --resource_manager_address=logp-diff-probe-pathways-head-0-0.logp-diff-probe:29001
                - --node_type=worker
                - --instance_type=tpuv5:4x8x8
              resources:
                limits: {google.com/tpu: '4'}
              volumeMounts:
              - {mountPath: /root/.config/gcloud, name: gcloud-adc}
            volumes:
            - {name: gcloud-adc, secret: {secretName: gcloud-adc-secret}}
